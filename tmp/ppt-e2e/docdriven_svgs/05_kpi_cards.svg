<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <image x="0" y="0" width="1280" height="720" href="content_bg_user.png" xlink:href="content_bg_user.png"/>
  <text x="56" y="88" fill="#004C8B" font-size="42" font-family="Microsoft YaHei" font-weight="700">年度KPI目标卡</text>
  <rect x="70" y="150" width="540" height="230" rx="18" fill="#FFFFFF" stroke="#D9DEE5"/>
  <use data-icon="chunk-filled/target" x="96" y="184" width="42" height="42" fill="#0074CC"/>
  <text x="152" y="215" fill="#123B5E" font-size="28" font-family="Microsoft YaHei">设备可用率</text>
  <text x="96" y="296" fill="#00A870" font-size="64" font-family="Arial" font-weight="700">96.8% 到 98.5%</text>
  <rect x="670" y="150" width="540" height="230" rx="18" fill="#FFFFFF" stroke="#D9DEE5"/>
  <use data-icon="chunk-filled/shield" x="696" y="184" width="42" height="42" fill="#DE002B"/>
