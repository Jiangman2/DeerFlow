  <text x="696" y="296" fill="#00A870" font-size="64" font-family="Arial" font-weight="700">71% 到 93%</text>
  <rect x="70" y="420" width="1140" height="220" rx="18" fill="#F5F9FC" stroke="#D9DEE5"/>
  <use data-icon="chunk-filled/bolt" x="98" y="454" width="42" height="42" fill="#0074CC"/>
  <text x="152" y="486" fill="#123B5E" font-size="28" font-family="Microsoft YaHei">效率目标：非计划停机率 5.2% 到 3.6%，平均处置时长 9.5h 到 5.6h</text>
  <text x="152" y="542" fill="#5B7185" font-size="22" font-family="Microsoft YaHei">通过告警治理、模型诊断、作业协同三条主线并行推进。</text>
