  <rect x="454" y="152" width="370" height="500" rx="20" fill="#F5F9FC" stroke="#D9DEE5"/>
  <use data-icon="chunk-filled/database" x="486" y="186" width="48" height="48" fill="#0074CC"/>
  <text x="548" y="220" fill="#123B5E" font-size="30" font-family="Microsoft YaHei" font-weight="700">数据口径不一</text>
  <text x="486" y="274" fill="#5B7185" font-size="22" font-family="Microsoft YaHei">- 设备主数据缺失率 14%</text>
