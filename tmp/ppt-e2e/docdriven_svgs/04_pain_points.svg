  <rect x="52" y="152" width="370" height="500" rx="20" fill="#F5F9FC" stroke="#D9DEE5"/>
  <use data-icon="chunk-filled/alert-triangle" x="84" y="186" width="48" height="48" fill="#DE002B"/>
  <text x="146" y="220" fill="#123B5E" font-size="30" font-family="Microsoft YaHei" font-weight="700">告警噪声高</text>
