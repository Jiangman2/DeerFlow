<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <image x="0" y="0" width="1280" height="720" href="content_bg_user.png" xlink:href="content_bg_user.png"/>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" fill-opacity="0.04"/>
  <text x="40" y="56" fill="#004C8B" font-size="36" font-family="Microsoft YaHei" font-weight="700">年度目标与核心KPI</text>
  <text x="40" y="100" fill="#004C8B" font-size="24" font-family="Microsoft YaHei" font-weight="700">量化目标卡</text>
  <text x="40" y="134" fill="#004C8B" font-size="24" font-family="Microsoft YaHei" font-weight="700">可靠性、效率、安全三维度</text>
  <rect x="56" y="176" width="370" height="210" rx="18" fill="#FFFFFF" stroke="#D9DEE5"/>
  <rect x="456" y="176" width="370" height="210" rx="18" fill="#FFFFFF" stroke="#D9DEE5"/>
  <rect x="856" y="176" width="370" height="210" rx="18" fill="#FFFFFF" stroke="#D9DEE5"/>
  <use data-icon="chunk-filled/target" x="84" y="206" width="40" height="40" fill="#0074CC"/>
  <text x="134" y="234" fill="#123B5E" font-size="22" font-family="Microsoft YaHei">设备可用率</text>
  <text x="84" y="326" fill="#0074CC" font-size="50" font-family="Arial" font-weight="700">96.8% 到 98.5%</text>
  <use data-icon="chunk-filled/shield" x="484" y="206" width="40" height="40" fill="#DE002B"/>
  <text x="534" y="234" fill="#123B5E" font-size="22" font-family="Microsoft YaHei">高风险闭环率</text>
  <text x="484" y="326" fill="#00A870" font-size="50" font-family="Arial" font-weight="700">71% 到 93%</text>
  <use data-icon="chunk-filled/bolt" x="884" y="206" width="40" height="40" fill="#0074CC"/>
  <text x="934" y="234" fill="#123B5E" font-size="22" font-family="Microsoft YaHei">非计划停机率</text>
  <text x="884" y="326" fill="#DE002B" font-size="50" font-family="Arial" font-weight="700">5.2% 到 3.6%</text>
  <rect x="56" y="416" width="1168" height="224" rx="18" fill="#F5F9FC" stroke="#D9DEE5"/>
  <text x="84" y="470" fill="#123B5E" font-size="24" font-family="Microsoft YaHei">指标解释：可靠性、效率、安全三维度联动，形成监测-诊断-处置-复盘闭环。</text>
  <text x="84" y="514" fill="#5B7185" font-size="22" font-family="Microsoft YaHei">KPI纳入月度经营分析与作业区考核。</text>
</svg>
