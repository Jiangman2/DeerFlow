# Candidate only: GLM-5.2 documents the switch; qualify FCGLM-001 itself before
# activating this profile with the updated EnterpriseGLMChat adapter.
# Replace only the existing GLM entry after acceptance; preserve list ordering.
models:
  - name: glm-5.3-flash
    display_name: GLM-5.3-Flash
    description: "企业 GLM · 闪速／深度思考 · 单张图片识别"
    use: deerflow.models.enterprise_glm:EnterpriseGLMChat
    model: GLM-5.3-Flash
    base_url: https://aiapi.cnooc.com.cn/GLM-5.3-Flash/FCGLM-001/v1
    api_key: $GLM_5_3_FLASH_API_KEY
    use_responses_api: false
    supports_thinking: true
    thinking_always_on: false
    supports_vision: true
    supports_reasoning_effort: false
    extra_body:
      thinking:
        type: enabled
    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled
    when_thinking_disabled:
      extra_body:
        thinking:
          type: disabled
    streaming: true
    stream_usage: true
    timeout: 120
    stream_chunk_timeout: 120
    request_deadline_seconds: 600
    max_retries: 0
