# Merge this one entry into the audited production models list; do not replace
# the whole configuration or change the default model. Inject GLM_5_3_FLASH_API_KEY
# from a required server-side Secret. No credentials belong in this file.
models:
  - name: glm-5.3-flash
    display_name: GLM-5.3-Flash
    description: "企业 GLM · 始终深度思考 · 单张图片识别"
    use: deerflow.models.enterprise_glm:EnterpriseGLMChat
    model: GLM-5.3-Flash
    base_url: https://aiapi.cnooc.com.cn/GLM-5.3-Flash/FCGLM-001/v1
    api_key: $GLM_5_3_FLASH_API_KEY
    use_responses_api: false
    supports_thinking: true
    thinking_always_on: true
    supports_vision: true
    # The shared selector uses low/medium/high. Keep provider default until a
    # per-provider effort selector is introduced; do not send low or medium.
    supports_reasoning_effort: false
    extra_body:
      thinking:
        type: enabled
    streaming: true
    stream_usage: true
    timeout: 120
    stream_chunk_timeout: 120
    request_deadline_seconds: 600
    max_retries: 0
