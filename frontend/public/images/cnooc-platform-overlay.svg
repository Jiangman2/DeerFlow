<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d6e8" stop-opacity="0.95" />
      <stop offset="1" stop-color="#6aa5ff" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c94c" stop-opacity="0.95" />
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0.55" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g opacity="0.9" filter="url(#glow)">
    <g transform="translate(830 250)">
