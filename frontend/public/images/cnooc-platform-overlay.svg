        <path d="M290 330 L540 392" stroke="#eaf2ff" stroke-width="4" opacity="0.28" />
        <path d="M310 360 L520 398" stroke="#eaf2ff" stroke-width="3" opacity="0.22" />
      </g>

      <rect x="310" y="390" width="90" height="220" rx="12" fill="url(#deck)" opacity="0.85" />
      <rect x="480" y="390" width="90" height="220" rx="12" fill="url(#deck)" opacity="0.85" />
      <rect x="335" y="415" width="40" height="170" rx="10" fill="#0b2f86" opacity="0.35" />
      <rect x="505" y="415" width="40" height="170" rx="10" fill="#0b2f86" opacity="0.35" />
