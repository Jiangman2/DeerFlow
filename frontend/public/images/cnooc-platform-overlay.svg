      <path d="M252 146 L388 252" stroke="#d7e6ff" stroke-width="8" stroke-linecap="round" opacity="0.35" />

      <rect x="320" y="230" width="30" height="150" rx="8" fill="url(#steel)" opacity="0.9" />
      <rect x="520" y="260" width="30" height="150" rx="8" fill="url(#steel)" opacity="0.9" />

      <rect x="250" y="270" width="360" height="120" rx="16" fill="url(#deck)" />
      <rect x="400" y="220" width="170" height="70" rx="10" fill="url(#deck)" opacity="0.95" />
      <rect x="445" y="160" width="100" height="70" rx="10" fill="url(#steel)" opacity="0.9" />

      <rect x="350" y="300" width="70" height="50" rx="10" fill="url(#steel)" opacity="0.85" />
      <rect x="440" y="300" width="70" height="50" rx="10" fill="url(#steel)" opacity="0.85" />
      <rect x="530" y="300" width="60" height="50" rx="10" fill="url(#steel)" opacity="0.85" />

