<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <title>中国海油海上新能源发展路线图</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f4f7fb;
        font-family: Arial, sans-serif;
      }
      .deck {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 18px;
      }
      .slide {
        width: 100%;
        margin: 0;
        background: white;
        box-shadow: 0 2px 12px #0b23401f;
      }
      .slide img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main class="deck">
      <figure class="slide"><img src="cnooc_new_energy_20260811.preview/slide-1.png" alt="第 1 页" /></figure>
      <figure class="slide"><img src="cnooc_new_energy_20260811.preview/slide-2.png" alt="第 2 页" /></figure>
      <figure class="slide"><img src="cnooc_new_energy_20260811.preview/slide-3.png" alt="第 3 页" /></figure>
      <figure class="slide"><img src="cnooc_new_energy_20260811.preview/slide-4.png" alt="第 4 页" /></figure>
      <figure class="slide"><img src="cnooc_new_energy_20260811.preview/slide-5.png" alt="第 5 页" /></figure>
    </main>
  </body>
</html>
