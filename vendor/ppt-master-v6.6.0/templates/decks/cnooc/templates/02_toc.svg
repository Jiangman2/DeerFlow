  <line id="agenda-rule-1" x1="340" y1="276" x2="1128" y2="276" stroke="#D9DEE5"
    stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <text id="agenda-number-2" x="340" y="348" fill="#0060A6"
    font-family="Arial, sans-serif" font-size="34" font-weight="700"
