  <rect id="agenda-accent-blue" x="340" y="174" width="104" height="4" rx="2" fill="#0060A6"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="agenda-accent-red" x="444" y="174" width="36" height="4" rx="2" fill="#DE002B"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <text id="agenda-number-1" x="340" y="252" fill="#0060A6"
