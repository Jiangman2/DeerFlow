<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="cnooc_corporate_master" data-pptx-master-name="CNOOC Corporate"
  data-pptx-layout="agenda" data-pptx-layout-name="Agenda">
  <rect id="cnooc-master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <image id="agenda-background" x="0" y="0" width="1280" height="720"
    href="../images/toc_bg.png" preserveAspectRatio="xMidYMid slice"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <text id="agenda-vertical-label" x="116" y="214" fill="#0060A6" fill-opacity="0.16"
