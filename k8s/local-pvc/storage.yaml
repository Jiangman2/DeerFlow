apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deer-flow-userdata-pvc
  namespace: deer-flow
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deer-flow-skills-pvc
  namespace: deer-flow
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
