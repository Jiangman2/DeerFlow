apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: deer-flow

resources:
  - namespace.yaml
  - storage.yaml
  - postgres.yaml
  - skills-sync.yaml
  - deer-flow-pvc-stack.yaml
  - mineru-adapter-local.yaml

patches:
  - path: gateway-mineru-local-patch.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: deer-flow-nginx-config
    files:
      - nginx.conf

images:
  - name: deer-flow-gateway
    newName: deer-flow-gateway
    newTag: dev-20260811-ppt-runner-v5
  - name: deer-flow-mineru-adapter
    newName: deer-flow-mineru-adapter
    newTag: dev-20260810-mineru-v1
  - name: deer-flow-frontend
    newName: deer-flow-frontend
    newTag: dev-20260811-dashboard-refresh-v1
  - name: deer-flow-provisioner
    newName: deer-flow-provisioner
    newTag: dev-20260810-responses-v1
  - name: deer-flow-skills
    newName: deer-flow-skills
    newTag: dev-20260810-ppt-master-v450-v1
