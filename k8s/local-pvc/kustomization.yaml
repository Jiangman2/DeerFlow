apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: deer-flow

resources:
  - namespace.yaml
  - storage.yaml
  - postgres.yaml
  - skills-sync.yaml
  - deer-flow-pvc-stack.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: deer-flow-nginx-config
    files:
      - nginx.conf

images:
  - name: deer-flow-gateway
    newName: deer-flow-gateway
    newTag: dev-20260722-ppt-completion-gates-v11-pg1
  - name: deer-flow-frontend
    newName: deer-flow-frontend
    newTag: dev-20260722-compaction-visibility-v5
  - name: deer-flow-provisioner
    newName: deer-flow-provisioner
    newTag: dev-20260722-sandbox-probes-23
  - name: deer-flow-skills
    newName: deer-flow-skills
    newTag: dev-20260721-official-ppt-v5
