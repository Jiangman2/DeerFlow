events {
    worker_connections 1024;
}
pid /tmp/nginx.pid;
        http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Bound unauthenticated Data Lake callbacks before they reach shared SQL.
    limit_req_zone $binary_remote_addr zone=data_lake_callback:10m rate=5r/s;

    # Docker internal DNS (for resolving k3s hostname)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Preserve an upstream proxy's X-Forwarded-Proto so the Gateway sees the real
    # client scheme when DeerFlow's nginx runs BEHIND another TLS-terminating
    # reverse proxy (e.g. Pangolin/Traefik, Cloudflare, Caddy). Without this the
    # Gateway treats HTTPS browser traffic as HTTP and rejects the login POST with
    # 403 "Cross-site auth request denied" (Origin scheme mismatch), and also drops
    # the Secure flag / max-age on session cookies. Falls back to $scheme when nginx
    # is itself the TLS edge (standalone `make dev` / Docker), so default
    # deployments are unchanged.
    map $http_x_forwarded_proto $forwarded_proto {
        default    $scheme;
        "~*^https" https;
    }

    # Preserve WebSocket upgrade semantics through the TLS edge server.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Main server (path-based routing) ─────────────────────────────────
    # Native SkillHub validates bearer tokens itself. Browser API traffic also
    # requires the current DeerFlow session; a bearer-shaped string grants no
    # backend access unless SkillHub validates the token and its scopes.
    map $http_authorization $skillhub_bearer_request {
        default 0;
        "~*^Bearer[ ]+.+$" 1;
    }

    server {
        listen 2026 default_server;
        listen [::]:2026 default_server;
        server_name _;

        # The built-in external-agent cards stay on the DeerFlow origin. Each
        # request must have a valid DeerFlow session before it is forwarded to
        # the private tool service; neither a Data Lake token nor an internal
        # service address reaches the browser.
        location = /_external_agent_auth {
            internal;
            proxy_pass http://gateway:8001/api/v1/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location @external_agent_login {
            return 302 https://$host/;
        }

        location = /zywdjxzj { return 302 /zywdjxzj/; }
        location ^~ /zywdjxzj/ {
            auth_request /_external_agent_auth;
            error_page 401 403 = @external_agent_login;
            proxy_pass http://10.57.128.79:8100/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_redirect off;
        }

        location = /dzsjtpzj { return 302 /dzsjtpzj/; }
        location ^~ /dzsjtpzj/ {
            auth_request /_external_agent_auth;
            error_page 401 403 = @external_agent_login;
            proxy_pass http://10.57.128.79:6000/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_redirect off;
        }

        location = /zjbgjszj { return 302 /zjbgjszj/; }
        location ^~ /zjbgjszj/ {
            auth_request /_external_agent_auth;
            error_page 401 403 = @external_agent_login;
            proxy_pass http://10.57.128.79:5004/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_redirect off;
        }

        location = /zdsczj { return 302 /zdsczj/; }
        location ^~ /zdsczj/ {
            auth_request /_external_agent_auth;
            error_page 401 403 = @external_agent_login;
            proxy_pass http://10.57.128.79:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_redirect off;
        }

        location = /qqyjbgbxzj { return 302 /qqyjbgbxzj/; }
        location ^~ /qqyjbgbxzj/ {
            auth_request /_external_agent_auth;
            error_page 401 403 = @external_agent_login;
            proxy_pass http://10.57.128.79:7860/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_redirect off;
        }

        location = /zwjkylxcczs { return 302 /zwjkylxcczs/; }

        location ^~ /zwjkylxcczs/ {
            auth_request /_external_agent_auth;
            error_page 401 403 = @external_agent_login;
            proxy_pass http://10.57.128.79:5010/;
            proxy_http_version 1.1;
            proxy_set_header Host 10.57.128.79:5010;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host 10.57.128.79:5010;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_redirect off;
        }

       location = /yjzs { return 302 /yjzs/; }

       location ^~ /yjzs/ {
           auth_request /_external_agent_auth;
           error_page 401 403 = @external_agent_login;

           proxy_pass http://10.57.128.79:10086/;
           proxy_http_version 1.1;
           proxy_buffering off;

           proxy_set_header Host 10.57.128.79:10086;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $forwarded_proto;
           proxy_set_header X-Forwarded-Host 10.57.128.79:10086;
           proxy_set_header X-Forwarded-Port 443;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;

           proxy_connect_timeout 30s;
           proxy_send_timeout 600s;
           proxy_read_timeout 600s;
           proxy_redirect off;
       }


        # HTTPS terminates in the sibling 2443 server and loops back here.
        # Trust only that loopback hop when restoring the client address used
        # by the callback limiter; direct callers cannot spoof X-Real-IP.
        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header X-Real-IP;
        real_ip_recursive on;

        # Resolve Docker service names at request time to avoid stale upstream
        # IPs when containers restart and receive new addresses.
        set $gateway_upstream gateway:8001;
        set $ppt_master_runner_upstream ppt-master-runner:8003;
        set $frontend_upstream frontend:3000;

        # Default proxy settings for all locations (streaming/SSE support)
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 100m;

        # Keep the unified nginx endpoint same-origin by default. When split
        # frontend/backend or port-forwarded deployments need browser CORS,
        # configure the Gateway allowlist with GATEWAY_CORS_ORIGINS so CORS and
        # CSRF origin checks stay aligned instead of approving every origin at
        # the proxy layer.

        # Preserve the complete native SkillHub web application under one
        # same-origin prefix. The upstream image is configured with this exact
        # base path, so browser routes, assets, APIs, OAuth callbacks, and CLI
        # device authorization all remain owned by SkillHub.
        location = /platform/skillhub {
            return 308 /platform/skillhub/;
        }

        # Validate the actual DeerFlow session, never caller-supplied identity.
        location = /_internal/skillhub/browser-auth {
            internal;
            proxy_pass http://gateway:8001/api/v1/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Owner-User-Id "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /_internal/skillhub/api-auth {
            internal;
            if ($skillhub_bearer_request) { return 204; }
            proxy_pass http://gateway:8001/api/v1/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Owner-User-Id "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location @skillhub_login {
            return 302 /login;
        }

        location = /_internal/skillhub/session-assertion {
            internal;
            # Keep this path-qualified upstream static. The production K8s
            # launcher intentionally removes $gateway_upstream after rendering,
            # and its exact proxy replacement does not match path suffixes.
            proxy_pass http://gateway:8001/internal/skillhub/session/assertion;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /platform/skillhub/api/v1/auth/session/bootstrap {
            auth_request /_internal/skillhub/session-assertion;
            auth_request_set $skillhub_identity $upstream_http_x_skillhub_identity;
            auth_request_set $skillhub_signature $upstream_http_x_skillhub_signature;
            proxy_pass http://skillhub-web:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Bootstrap is authenticated by Gateway's short-lived assertion.
            # Never let a stale native SkillHub SESSION cookie override it.
            proxy_set_header Cookie "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /platform/skillhub;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-SkillHub-Identity $skillhub_identity;
            proxy_set_header X-SkillHub-Signature $skillhub_signature;
            proxy_pass_header Set-Cookie;
        }

        location = /platform/skillhub/api/web/notifications/sse {
            auth_request /_internal/skillhub/api-auth;
            proxy_pass http://skillhub-web:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /platform/skillhub;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-SkillHub-Identity "";
            proxy_set_header X-SkillHub-Signature "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 660s;
            proxy_set_header X-Accel-Buffering no;
            proxy_pass_header Set-Cookie;
        }

        location ^~ /platform/skillhub/api/ {
            auth_request /_internal/skillhub/api-auth;
            proxy_pass http://skillhub-web:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /platform/skillhub;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-SkillHub-Identity "";
            proxy_set_header X-SkillHub-Signature "";
            proxy_pass_header Set-Cookie;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
            sub_filter_once off;
            sub_filter "frame-ancestors 'none'" "frame-ancestors 'self'";
        }

        location ^~ /platform/skillhub/ {
            auth_request /_internal/skillhub/browser-auth;
            error_page 401 = @skillhub_login;
            proxy_pass http://skillhub-web:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /platform/skillhub;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-SkillHub-Identity "";
            proxy_set_header X-SkillHub-Signature "";
            proxy_pass_header Set-Cookie;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
            sub_filter_once off;
            sub_filter "frame-ancestors 'none'" "frame-ancestors 'self'";
        }

        # Serve the knowledge-base UI through the same DeerFlow origin. Docker
        # Desktop Kubernetes does not expose NodePorts on the Windows host in
        # every setup, while the UI also needs same-origin DeerFlow cookies for
        # SSO. These locations keep WeKnora's absolute asset/API URLs working
        # without exposing a second browser origin.
        location ^~ /platform/ {
            proxy_pass http://weknora-frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_hide_header Cache-Control;
            add_header Cache-Control 'no-cache, must-revalidate' always;
        }

        # These patched WeKnora modules previously shipped with immutable
        # cache headers. Force one clean fetch after the SSO fix.
        location = /assets/index-DeX5ZUuT.js {
            proxy_pass http://weknora-frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_set_header Host $http_host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control 'no-store' always;
        }

        location ^~ /assets/ {
            proxy_pass http://weknora-frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /config.js {
            proxy_pass http://weknora-frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_set_header Host $http_host;
        }

        location ^~ /tdesign-icons/ {
            proxy_pass http://weknora-frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_set_header Host $http_host;
        }

        # WeKnora and DeerFlow both expose /api/v1/auth/me. The public route
        # remains owned by DeerFlow; this exact adapter route lets the embedded
        # WeKnora UI load its native user, tenant, membership, and capability
        # payload without changing either application's auth contract.
        location = /api/weknora-native/auth/me {
            proxy_pass http://weknora-app:8080/api/v1/auth/me;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Validate a previously selected WeKnora workspace without surfacing
        # the native API's expected 400/403 response in the browser console.
        # A valid workspace returns the native /auth/me payload; an invalid or
        # no-longer-accessible workspace returns a successful sentinel payload
        # so the SSO bootstrap can clear only its stale tenant-scoped state.
        location = /api/weknora-native/validate-tenant {
            proxy_pass http://weknora-app:8080/api/v1/auth/me;
            proxy_intercept_errors on;
            error_page 400 403 = @weknora_invalid_target_tenant;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location @weknora_invalid_target_tenant {
            internal;
            default_type application/json;
            return 200 '{"valid":false}';
        }

        location = /api/v1/auth/setup-status {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # DeerFlow owns this logout endpoint. Keep it ahead of the WeKnora
        # /api/v1/ catch-all so signing out also clears DeerFlow's HttpOnly
        # access_token cookie and allows switching accounts.
        location = /api/v1/auth/logout {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # DeerFlow's browser login endpoints must not be sent to WeKnora's
        # similarly named auth routes. WeKnora SSO is handled by the separate
        # /api/weknora/sso-session endpoint above the generic API proxy.
        location = /api/v1/auth/providers {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /api/v1/auth/login/local {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /api/v1/auth/register {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /api/v1/auth/me {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /api/v1/auth/initialize {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /api/v1/auth/change-password {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ^~ /api/v1/auth/cnooc/ {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ^~ /api/v1/auth/oauth/ {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ^~ /api/v1/auth/callback/ {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # IAM browser authorization-code endpoints must reach Gateway before
        # the WeKnora /api/v1/ catch-all.
        location ^~ /api/v1/auth/iam/ {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # IAM BIM synchronization is a credentialed machine-to-machine
        # protocol. Route its registration base URL and service subpaths to
        # Gateway before the WeKnora /api/v1/ catch-all.
        location = /api/v1/iam/account-sync {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ^~ /api/v1/iam/account-sync/ {
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Authenticated Data Lake browser endpoints belong to DeerFlow
        # Gateway. The exact public callback route remains separately
        # rate-limited below and takes precedence over this prefix.
        location ^~ /api/v1/data-lake/auth/ {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Group OA policy-flow is a machine-to-machine Gateway API. Keep both
        # the submission endpoint and its job/result children ahead of
        # WeKnora's native /api/v1/ catch-all, and preserve the scoped Bearer
        # credential across the proxy boundary.
        location = /api/v1/integrations/oa/policy-flow/jobs {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            client_max_body_size 11m;
            client_body_timeout 60s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ^~ /api/v1/integrations/oa/policy-flow/jobs/ {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ^~ /api/v1/ {
            proxy_pass http://weknora-app:8080;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /weknora-widget.js {
            proxy_pass http://weknora-frontend:80;
            proxy_set_header Host $http_host;
        }

        location ^~ /embed/ {
            proxy_pass http://weknora-frontend:80;
            proxy_set_header Host $http_host;
        }

        location = /files {
            proxy_pass http://weknora-app:8080;
            proxy_set_header Host $http_host;
        }

        location ^~ /files/ {
            proxy_pass http://weknora-app:8080;
            proxy_set_header Host $http_host;
        }

        # Isolated upstream-authoritative PPT Master Agent runtime. DeerFlow
        # keeps only the authenticated streaming transport at this boundary.
        location /api/ppt-master-runtime/ {
            rewrite ^/api/ppt-master-runtime/(.*) /api/$1 break;
            proxy_pass http://$ppt_master_runner_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection '';
            proxy_set_header X-Accel-Buffering no;

            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            chunked_transfer_encoding on;
        }

        # Same-origin browser microphone stream. Authentication remains owned
        # by Gateway; Nginx only preserves the WebSocket upgrade end to end.
        location = /api/voice-input/stream {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 660s;
            proxy_read_timeout 660s;
        }

        # LangGraph-compatible API routes served by Gateway.
        # Rewrites /api/langgraph/* to /api/* before proxying to Gateway.
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*) /api/$1 break;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection '';

            # SSE/Streaming support
            proxy_set_header X-Accel-Buffering no;

            # Keep large JSON chat requests in the proxy stream instead of
            # spooling them through nginx's temporary request-body directory.
            client_max_body_size 20M;
            proxy_request_buffering off;

            # Timeouts for long-running requests
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Chunked transfer encoding
            chunked_transfer_encoding on;
        }

        # Frontend API: runtime configuration is served by Next.js, not Gateway.
        location /api/runtime-config {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Frontend API: external-agent launch handlers read the HttpOnly
        # platform-token cookie and issue allowlisted data-lake redirects.
        location ^~ /api/cnooc/external-agents/ {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Frontend API: shop-cart list and download handlers exchange the
        # HttpOnly platform-token cookie for data-lake API requests.
        location ^~ /api/shop-cart/ {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Custom API: Models endpoint
        location /api/models {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # Custom API: Memory endpoint
        location /api/memory {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # Custom API: MCP configuration endpoint
        location /api/mcp {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # Custom API: Skills configuration endpoint
        location /api/skills {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Skill install/edit/rollback may run one LLM security scan per file.
            proxy_read_timeout 600s;
        }

        # Custom API: Agents endpoint
        location /api/agents {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # Custom API: Uploads endpoint
        location ~ ^/api/threads/[^/]+/uploads {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Large file upload support
            client_max_body_size 100M;
            proxy_request_buffering off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Disable response buffering to avoid permission errors
        }

        # Live digital-employee browser stream. Match before the generic thread
        # proxy so the WebSocket upgrade and long-lived timeouts are preserved.
        location ~ ^/api/threads/[^/]+/browser/stream {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Custom API: Other endpoints under /api/threads
        location ~ ^/api/threads {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Compaction, suggestions, and run waits may exceed nginx's 60s default.
            proxy_read_timeout 600s;
        }

        # API Documentation: Swagger UI
        location /docs {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # API Documentation: ReDoc
        location /redoc {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # API Documentation: OpenAPI Schema
        location /openapi.json {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # Health check endpoint (gateway)
        location /health {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # ── Provisioner API (sandbox management) ────────────────────────
        # Use a variable so nginx resolves provisioner at request time (not startup).
        # This allows nginx to start even when provisioner container is not running.
        location /api/sandboxes {
            set $provisioner_upstream provisioner:8002;
            proxy_pass http://$provisioner_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # Public Data Lake callback. Keep this exact route ahead of the API
        # catch-all so malformed or replayed requests cannot flood shared SQL.
        location = /api/v1/data-lake/auth/callback {
            limit_req zone=data_lake_callback burst=10 nodelay;
            limit_req_status 429;
            error_page 429 = @data_lake_callback_rate_limited;

            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location @data_lake_callback_rate_limited {
            internal;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Request-Id $request_id always;
            return 429 '{"code":"callback_rate_limited","message":"Too many callback requests."}';
        }

        # Catch-all for /api/ routes not covered above (e.g. /api/v1/auth/*).
        # More specific prefix and regex locations above still take precedence.
        location /api/ {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Disable buffering to avoid permission errors when nginx
            # runs as a non-root user (e.g. local development).
            # Run waits and input-polish model calls may exceed 60 seconds.
            proxy_read_timeout 600s;
        }

        # Content-hashed Next.js assets stay reusable across visits, while the
        # HTML shell below must be revalidated after every frontend rollout.
        location ^~ /_next/static/ {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # All other requests go to frontend
        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, must-revalidate" always;

            # Timeouts
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }

    # HTTPS edge for the local-PVC deployment. The container's TLS listener
    # is published by the existing deployment as the browser-facing endpoint;
    # keep one HTTP routing table on port 2026 behind it.
    server {
        listen 2443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 100m;
        proxy_buffering off;
        proxy_cache off;

        location / {
            proxy_pass http://127.0.0.1:2026;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
