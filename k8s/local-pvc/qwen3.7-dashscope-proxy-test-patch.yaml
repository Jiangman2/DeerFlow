# Opt-in test-environment overlay for the Gateway Qwen3.7-Plus model.
#
# The local-PVC baseline deliberately clears HTTP(S)_PROXY for Docker Desktop.
# Apply this strategic-merge patch only where DashScope must use the egress
# proxy. Proxy URLs remain secret values in deer-flow-env and never enter
# config.yaml or the model's request payload.
#
# Usage:
#   kubectl -n deer-flow patch deployment gateway --type=strategic \
#     --patch-file k8s/local-pvc/qwen3.7-dashscope-proxy-test-patch.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            - name: HTTP_PROXY
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: HTTP_PROXY
                  optional: true
            - name: HTTPS_PROXY
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: HTTPS_PROXY
                  optional: true
            - name: http_proxy
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: http_proxy
                  optional: true
            - name: https_proxy
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: https_proxy
                  optional: true
