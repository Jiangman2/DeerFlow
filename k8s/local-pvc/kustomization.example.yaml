apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storage.yaml
  - postgres.yaml
  - skills-sync.yaml
  - deer-flow-pvc-stack.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: deer-flow-nginx-config
    files:
      - nginx.conf

# Copy this file to kustomization.yaml or update kustomization.yaml in CI.
# Use immutable tags, ideally tied to the git commit or release version.
images:
  - name: deer-flow-gateway
    newName: registry.example.com/deer-flow-gateway
    newTag: 2026.06.26-gitsha
  - name: deer-flow-frontend
    newName: registry.example.com/deer-flow-frontend
    newTag: 2026.06.26-gitsha
  - name: deer-flow-provisioner
    newName: registry.example.com/deer-flow-provisioner
    newTag: 2026.06.26-gitsha
  - name: deer-flow-skills
    newName: registry.example.com/deer-flow-skills
    newTag: 2026.06.26-gitsha
