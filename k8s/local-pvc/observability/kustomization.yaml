apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storage.yaml
  - loki.yaml
  - grafana.yaml
  - alloy.yaml
  - network-policy.yaml
configMapGenerator:
  - name: loki-config
    namespace: observability
    files:
      - loki.yaml=loki-config.yaml
  - name: alloy-config
    namespace: observability
    files:
      - config.alloy
  - name: grafana-datasources
    namespace: observability
    files:
      - datasources.yaml
