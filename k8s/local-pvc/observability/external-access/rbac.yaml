# 供**集群外**的 Grafana 通过 `kubectl port-forward` 读取本命名空间 Loki 使用。
#
# 刻意**不**加入 ../kustomization.yaml 的 resources：
#   - 它属于"外部接入"，不是日志栈本体，部署日志栈的人不应该顺带拿到一份集群外凭证；
#   - token Secret 会生成一个长期有效的凭证，必须由运维显式执行。
#
# 权限边界（最小化）：
#   - 只在本命名空间生效（Role/RoleBinding，不是 ClusterRole）
#   - 只能 get/list services,pods,endpoints,endpointslices（port-forward 需要把 Service 解析成 Pod）
#   - 只能 create pods/portforward（真正的转发权限）
#   - 读不到任何 Secret，也碰不到其它命名空间
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-portforward
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loki-portforward
  namespace: observability
rules:
  - apiGroups: [""]
    resources: ["services", "pods", "endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-portforward
  namespace: observability
subjects:
  - kind: ServiceAccount
    name: loki-portforward
    namespace: observability
roleRef:
  kind: Role
  name: loki-portforward
  apiGroup: rbac.authorization.k8s.io
