# 长期有效的 ServiceAccount token（**不会过期**）。
#
# 这一步依赖集群仍支持 legacy `kubernetes.io/service-account-token` Secret
# （k8s 1.24 起不再自动创建，但手工创建仍会被 token controller 填充）。
# 实测 datax 集群 k8s v1.36.2 仍然可用，token 长度 944 字符。
#
# 如果某天该方式失效（.data.token 为空），改用有期限的 token：
#   kubectl -n observability create token loki-portforward --duration=8760h
# 并建立每年续期的提醒。
#
# 撤销（凭证泄露或不再需要外部接入时）：
#   kubectl -n observability delete secret loki-portforward-token
#   # 若使用有期限 token，则删除凭证本身即可
# 删除后旧 token 立即失效，外部 Grafana 的数据源需要重新配置。
apiVersion: v1
kind: Secret
metadata:
  name: loki-portforward-token
  namespace: observability
  annotations:
    kubernetes.io/service-account.name: loki-portforward
type: kubernetes.io/service-account-token
