apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            - name: WEKNORA_PRESENTATION_PARSER_ENGINE
              value: mineru
            - name: WEKNORA_MINERU_ENDPOINT
              value: http://deer-flow-mineru-adapter:50052
            - name: WEKNORA_MINERU_SCANNED_PDF_FALLBACK
              value: "true"
            - name: WEKNORA_MINERU_DOCUMENT_VISUAL_FALLBACK
              value: "true"
            # Docker Desktop has no enterprise MinerU upstream. Conversation
            # uploads must return the original file immediately so ppt-master
            # can inspect a PPT/PPTX template inside its Sandbox instead of
            # waiting for the intentionally unreachable local adapter target.
            - name: DEERFLOW_UPLOAD_DOCUMENT_PARSER_ENABLED
              value: "false"
            - name: DEERFLOW_UPLOAD_DOCUMENT_FALLBACK_ENABLED
              value: "false"
