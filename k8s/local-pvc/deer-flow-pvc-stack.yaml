apiVersion: v1
kind: ServiceAccount
metadata:
  name: deer-flow-provisioner
  namespace: deer-flow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deer-flow-provisioner
  namespace: deer-flow
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deer-flow-provisioner
  namespace: deer-flow
subjects:
  - kind: ServiceAccount
    name: deer-flow-provisioner
    namespace: deer-flow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deer-flow-provisioner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioner
  namespace: deer-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioner
  template:
    metadata:
      labels:
        app: provisioner
    spec:
      serviceAccountName: deer-flow-provisioner
      containers:
        - name: provisioner
          image: deer-flow-provisioner
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: deer-flow-env
          ports:
            - containerPort: 8002
          env:
            - name: K8S_NAMESPACE
              value: deer-flow
            - name: K8S_CREATE_NAMESPACE
              value: "false"
            - name: SANDBOX_IMAGE
              value: deer-flow-aio-sandbox:ppt-master-dev-20260805-upstream-v1
            - name: SKILLS_PVC_NAME
              value: deer-flow-skills-pvc
            - name: USERDATA_PVC_NAME
              value: deer-flow-userdata-pvc
            - name: SANDBOX_ACCESS_MODE
              value: cluster
            - name: KUBECONFIG_WAIT_SECONDS
              value: "0"
            - name: SANDBOX_READINESS_INITIAL_DELAY_SECONDS
              value: "5"
            - name: SANDBOX_READINESS_PERIOD_SECONDS
              value: "5"
            - name: SANDBOX_READINESS_TIMEOUT_SECONDS
              value: "5"
            - name: SANDBOX_READINESS_FAILURE_THRESHOLD
              value: "3"
            - name: SANDBOX_LIVENESS_INITIAL_DELAY_SECONDS
              value: "10"
            - name: SANDBOX_LIVENESS_PERIOD_SECONDS
              value: "10"
            - name: SANDBOX_LIVENESS_TIMEOUT_SECONDS
              value: "5"
            - name: SANDBOX_LIVENESS_FAILURE_THRESHOLD
              value: "6"
            - name: SANDBOX_CPU_REQUEST
              value: 500m
            - name: SANDBOX_MEMORY_REQUEST
              value: 512Mi
            - name: SANDBOX_CPU_LIMIT
              value: "2"
            - name: SANDBOX_MEMORY_LIMIT
              value: 2Gi
            - name: SANDBOX_ENV_SECRET_NAME
              value: deer-flow-env
            - name: SANDBOX_SECRET_ENV_KEYS
              value: DASHSCOPE_API_KEY,PEXELS_API_KEY,PIXABAY_API_KEY,SANDBOX_API_KEY
            - name: SANDBOX_PASSTHROUGH_ENV_KEYS
              value: IMAGE_BACKEND,IMAGE_GENERATION_PROVIDER,QWEN_BASE_URL,QWEN_MODEL,DASHSCOPE_BASE_URL,DASHSCOPE_IMAGE_MODEL,VIDEO_GENERATION_PROVIDER,DASHSCOPE_VIDEO_MODEL,DASHSCOPE_VIDEO_DURATION,DASHSCOPE_VIDEO_RESOLUTION,PODCAST_GENERATION_PROVIDER,DASHSCOPE_TTS_MODEL,DASHSCOPE_TTS_VOICE_MALE,DASHSCOPE_TTS_VOICE_FEMALE,MUSIC_GENERATION_PROVIDER,DASHSCOPE_MUSIC_MODEL,DASHSCOPE_MUSIC_GENDER,DASHSCOPE_MUSIC_FORMAT,IMAGE_CONCURRENCY,IMAGE_SEARCH_CONCURRENCY,DASHSCOPE_TLS_COMPAT
            - name: IMAGE_BACKEND
              value: qwen
            - name: IMAGE_GENERATION_PROVIDER
              value: dashscope
            - name: QWEN_BASE_URL
              value: https://dashscope.aliyuncs.com
            - name: QWEN_MODEL
              value: qwen-image-2.0-pro
            - name: DASHSCOPE_BASE_URL
              value: https://dashscope.aliyuncs.com/api/v1
            - name: DASHSCOPE_IMAGE_MODEL
              value: qwen-image-2.0-pro
            - name: VIDEO_GENERATION_PROVIDER
              value: dashscope
            - name: DASHSCOPE_VIDEO_MODEL
              value: wan2.7-t2v
            - name: DASHSCOPE_VIDEO_DURATION
              value: "5"
            - name: DASHSCOPE_VIDEO_RESOLUTION
              value: 720P
            - name: PODCAST_GENERATION_PROVIDER
              value: dashscope
            - name: DASHSCOPE_TTS_MODEL
              value: qwen3-tts-flash
            - name: DASHSCOPE_TTS_VOICE_MALE
              value: Ethan
            - name: DASHSCOPE_TTS_VOICE_FEMALE
              value: Cherry
            - name: MUSIC_GENERATION_PROVIDER
              value: dashscope
            - name: DASHSCOPE_MUSIC_MODEL
              value: fun-music-v1
            - name: DASHSCOPE_MUSIC_GENDER
              value: female
            - name: DASHSCOPE_MUSIC_FORMAT
              value: mp3
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            # Docker Desktop can spend several minutes faulting the Python and
            # Kubernetes-client layers back in after its WSL VM cold-starts.
            # Keep runtime readiness/liveness strict, but do not kill the
            # provisioner while that one-time startup work is still running.
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: provisioner
  namespace: deer-flow
spec:
  selector:
    app: provisioner
  ports:
    - name: http
      port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: deer-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
        - name: seed-extensions-config
          image: deer-flow-gateway:dev-20260726-consolidation-v1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              python - <<'PY'
              import json
              import os
              from pathlib import Path

              seed_path = Path("/seed/extensions_config.json")
              target_path = Path("/runtime-home/runtime-config/extensions_config.json")
              seed = json.loads(seed_path.read_text(encoding="utf-8"))
              current = {}
              if target_path.is_file() and target_path.stat().st_size:
                  current = json.loads(target_path.read_text(encoding="utf-8"))

              merged = dict(seed)
              merged.update(current)
              for key in ("mcpServers", "skills"):
                  entries = dict(seed.get(key) or {})
                  entries.update(current.get(key) or {})
                  merged[key] = entries

              target_path.parent.mkdir(parents=True, exist_ok=True)
              temporary_path = target_path.with_suffix(".json.tmp")
              temporary_path.write_text(
                  json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              os.chmod(temporary_path, 0o600)
              temporary_path.replace(target_path)
              PY
          volumeMounts:
            - name: extensions-config
              mountPath: /seed/extensions_config.json
              subPath: extensions_config.json
              readOnly: true
            - name: userdata
              mountPath: /runtime-home
              subPath: deer-flow
        - name: wait-for-skills
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - until test -f /app/skills/.deerflow-skills-ready; do sleep 2; done
          volumeMounts:
            - name: skills
              mountPath: /app/skills
              readOnly: true
      containers:
        - name: gateway
          image: deer-flow-gateway:dev-20260726-consolidation-v1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - cd backend && PYTHONPATH=. uv run --no-sync uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers 1
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: deer-flow-env
          env:
            - name: CI
              value: "true"
            - name: GATEWAY_PORT
              value: "8001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deer-flow-postgres
                  key: DATABASE_URL
            - name: DEER_FLOW_PROJECT_ROOT
              value: /app
            - name: DEER_FLOW_HOME
              value: /app/backend/.deer-flow
            - name: DEER_FLOW_CONFIG_PATH
              value: /app/backend/config.yaml
            - name: DEER_FLOW_EXTENSIONS_CONFIG_PATH
              value: /app/backend/.deer-flow/runtime-config/extensions_config.json
            - name: DEER_FLOW_CHANNELS_LANGGRAPH_URL
              value: http://gateway:8001/api
            - name: DEER_FLOW_CHANNELS_GATEWAY_URL
              value: http://gateway:8001
            - name: WEKNORA_DB_HOST
              value: weknora-postgres
            - name: WEKNORA_DB_PORT
              value: "5432"
            - name: WEKNORA_DB_USER
              value: postgres
            - name: WEKNORA_DB_NAME
              value: WeKnora
            - name: WEKNORA_DB_CONNECT_TIMEOUT_SECONDS
              value: "3"
            - name: WEKNORA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weknora-secret
                  key: DB_PASSWORD
                  optional: true
            - name: LLM_MODEL_NAME
              value: qwen-plus
            - name: LLM_BASE_URL
              value: https://dashscope.aliyuncs.com/compatible-mode/v1
            - name: LLM_PROVIDER
              value: aliyun
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weknora-secret
                  key: LLM_API_KEY
                  optional: true
            - name: EMBEDDING_MODEL_NAME
              value: text-embedding-v4
            - name: EMBEDDING_BASE_URL
              value: http://gateway:8001/api/weknora/bailian/v1
            - name: EMBEDDING_PROVIDER
              value: generic
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weknora-secret
                  key: EMBEDDING_API_KEY
                  optional: true
            - name: DeepSeek_V4_API_KEY
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: DeepSeek_V4_API_KEY
                  optional: true
            - name: NO_PROXY
              value: localhost,127.0.0.1,::1,gateway,provisioner,host.docker.internal,model.ai.cnooc,.svc,.cluster.local
            - name: no_proxy
              value: localhost,127.0.0.1,::1,gateway,provisioner,host.docker.internal,model.ai.cnooc,.svc,.cluster.local
          volumeMounts:
            - name: config
              mountPath: /app/backend/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: extensions-config
              mountPath: /app/backend/extensions_config.json
              subPath: extensions_config.json
              readOnly: true
            - name: userdata
              mountPath: /app/backend/.deer-flow
              subPath: deer-flow
            - name: skills
              mountPath: /app/skills
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/auth/setup-status
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          startupProbe:
            httpGet:
              path: /api/v1/auth/setup-status
              port: 8001
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 180
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: config
          configMap:
            name: deer-flow-config
        - name: extensions-config
          configMap:
            name: deer-flow-extensions-config
        - name: userdata
          persistentVolumeClaim:
            claimName: deer-flow-userdata-pvc
        - name: skills
          persistentVolumeClaim:
            claimName: deer-flow-skills-pvc
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: deer-flow
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: deer-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: deer-flow-frontend:dev-20260726-consolidation-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: deer-flow-env
          env:
            - name: DEER_FLOW_INTERNAL_GATEWAY_BASE_URL
              value: http://gateway:8001
            - name: NEXT_PUBLIC_STATIC_WEBSITE_ONLY
              value: "true"
            - name: WEKNORA_FRONTEND_URL
              value: http://127.0.0.1:2026/platform/knowledge-bases
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: deer-flow
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: deer-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              cp /etc/nginx/nginx.conf.template /tmp/nginx.conf
              sed -i 's|resolver 127.0.0.11 valid=10s ipv6=off;|# Static Kubernetes Service upstreams do not need Docker DNS.|' /tmp/nginx.conf
              sed -i 's|set $gateway_upstream gateway:8001;|# gateway upstream is a Kubernetes Service.|' /tmp/nginx.conf
              sed -i 's|set $frontend_upstream frontend:3000;|# frontend upstream is a Kubernetes Service.|' /tmp/nginx.conf
              sed -i 's|set $provisioner_upstream provisioner:8002;|# provisioner upstream is a Kubernetes Service.|' /tmp/nginx.conf
              sed -i 's|proxy_pass http://$gateway_upstream;|proxy_pass http://gateway:8001;|g' /tmp/nginx.conf
              sed -i 's|proxy_pass http://$frontend_upstream;|proxy_pass http://frontend:3000;|g' /tmp/nginx.conf
              sed -i 's|proxy_pass http://$provisioner_upstream;|proxy_pass http://provisioner:8002;|g' /tmp/nginx.conf
              nginx -c /tmp/nginx.conf -g 'daemon off;'
          ports:
            - containerPort: 2026
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf.template
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/auth/setup-status
              port: 2026
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 2026
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          startupProbe:
            httpGet:
              path: /api/v1/auth/setup-status
              port: 2026
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: nginx-config
          configMap:
            name: deer-flow-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: deer-flow
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 2026
      targetPort: 2026
