apiVersion: v1
kind: Secret
metadata:
  name: deer-flow-postgres
  namespace: deer-flow
type: Opaque
stringData:
  POSTGRES_DB: "deerflow"
  POSTGRES_USER: "deerflow"
  POSTGRES_PASSWORD: "replace-with-generated-password"
  DATABASE_URL: "postgresql://deerflow:replace-with-generated-password@postgres:5432/deerflow"
