apiVersion: v1
kind: Secret
metadata:
  name: deer-flow-env
  namespace: deer-flow
type: Opaque
stringData:
  # Generate unique values per environment.
  AUTH_JWT_SECRET: "replace-me"
  BETTER_AUTH_SECRET: "replace-me"
  DEER_FLOW_INTERNAL_AUTH_TOKEN: "replace-me"
  PROVISIONER_API_KEY: "replace-me"

  # Public/base URL settings.
  BETTER_AUTH_URL: "http://127.0.0.1:2026"
  BETTER_AUTH_BASE_URL: "http://127.0.0.1:2026"
  GATEWAY_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8090,http://127.0.0.1:8090,http://localhost:32090,http://127.0.0.1:32090"
  # Browser-facing URL for the native WeKnora frontend.
  # Local port-forward default: http://127.0.0.1:8090
  # Production should use the WeKnora Ingress/LoadBalancer URL.
  WEKNORA_FRONTEND_URL: "http://127.0.0.1:8090"
  # Gateway images for this stack must include the PostgreSQL extra because
  # config.yaml uses database/checkpointer/store PostgreSQL backends.
  UV_EXTRAS: "postgres"

  # Model and tool provider keys. Keep only the providers you use.
  DASHSCOPE_API_KEY: "replace-me"
  TAVILY_API_KEY: "replace-me"
  GEMINI_API_KEY: "replace-me"
  DEEPSEEK_API_KEY: "replace-me"
  DeepSeek_V4_API_KEY: "replace-me"
  DEEPSEEK_SILICONFLOW_API_KEY: "replace-me"
  HECC_API_KEY: "replace-me"
  HECC_BASE_URL: "replace-me"
  QWEN_API_KEY: "replace-me"
  JINA_API_KEY: "replace-me"
  PEXELS_API_KEY: "replace-me"
  PIXABAY_API_KEY: "replace-me"

  # Optional WeKnora knowledge platform integration.
  # When k8s/weknora is deployed in this namespace, Gateway should use the
  # stable in-cluster Service URL below.
  WEKNORA_API_URL: "http://weknora-app:8080"
  WEKNORA_SSO_SECRET: "replace-me"
  # Optional fallback for non-user/background WeKnora tool calls. DeerFlow UI
  # and chat runs with a logged-in user prefer the user's WeKnora bearer token.
  WEKNORA_API_KEY: "replace-me"
  WEKNORA_KNOWLEDGE_BASE_IDS: "replace-me"
  WEKNORA_TIMEOUT_SECONDS: "300"

  # Optional CNOOC data-lake platform SSO. Required when users enter DeerFlow
  # through /oauth/cnooc/login?token=<platform-token>.
  CNOOC_OAUTH_BASE_URL: "https://datalake.cnooc"
  CNOOC_OAUTH_APP_NAME: "deerflow"
  CNOOC_OAUTH_APP_ID: "replace-me"
  CNOOC_OAUTH_TOKEN_CHECK_API_TOKEN: "replace-me"
  CNOOC_OAUTH_TOKEN_CHECK_LOGIN_USER_CODE: "replace-me"
  CNOOC_OAUTH_USER_INFO_API_TOKEN: "replace-me"
  CNOOC_OAUTH_TLS_VERIFY: "true"
  NEXT_PUBLIC_AUTH_LOGIN_URL: ""

  # Do not set DATABASE_URL here for the local-pvc stack.
  # DATABASE_URL belongs to the deer-flow-postgres Secret.
