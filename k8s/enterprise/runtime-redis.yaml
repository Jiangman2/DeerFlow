apiVersion: v1
kind: Service
metadata:
  name: deerflow-runtime-redis
  namespace: deer-flow
spec:
  selector:
    app: deerflow-runtime-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deerflow-runtime-redis
  namespace: deer-flow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deerflow-runtime-redis
  template:
    metadata:
      labels:
        app: deerflow-runtime-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: datax-03
      initContainers:
        - name: prepare-runtime
          image: busybox
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              mkdir -p /data
              chown 999:999 /data
              chmod 0700 /data
              umask 077
              password="$(cat /run/redis-secret/password)"
              test -n "${password}"
              cat > /run/redis-config/redis.conf <<EOF
              bind 0.0.0.0 ::
              protected-mode yes
              port 6379
              dir /data
              appendonly yes
              appendfsync everysec
              aof-use-rdb-preamble yes
              maxmemory-policy noeviction
              requirepass ${password}
              EOF
              chown 999:999 /run/redis-config/redis.conf
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runtime-config
              mountPath: /run/redis-config
            - name: auth
              mountPath: /run/redis-secret
              readOnly: true
      containers:
        - name: redis
          image: redis
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "/run/redis-config/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$(cat /run/redis-secret/password)" redis-cli ping | grep -qx PONG
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$(cat /run/redis-secret/password)" redis-cli ping | grep -qx PONG
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runtime-config
              mountPath: /run/redis-config
              readOnly: true
            - name: auth
              mountPath: /run/redis-secret
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: /opt/deerflow-storage/deerflow-runtime-redis
            type: DirectoryOrCreate
        - name: runtime-config
          emptyDir: {}
        - name: auth
          secret:
            secretName: deerflow-runtime-redis-auth
