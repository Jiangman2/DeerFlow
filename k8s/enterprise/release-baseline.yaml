version: 1
name: CNOOC DeerFlow enterprise release baseline
scope:
  architecture: arm64
  namespace: deer-flow
  control_plane: datax-01
  workers:
    - datax-02
    - datax-03

# Capability-parity snapshot of the production deployment after the accepted
# 2026-09-15 rollouts. This inventory contains no credentials or production
# data. Test environments must provide their own Secret values and storage.
production_snapshot:
  captured_at: 2026-09-15
  source_branch: codex/enterprise-consolidation-20260716
  database_schema: 90|false
  kustomize_images:
    paradedb/paradedb: deerflow.local/weknora-postgres:pg16-search-arm64-20260722-1
    wechatopenai/weknora-app: deerflow.local/weknora-app:0.8.0-enterprise-proxy1-anydoc1-arm64-20260912
    wechatopenai/weknora-ui: deerflow.local/weknora-ui:0.8.0-enterprise-sso2-r5-arm64-20260913
    deer-flow-gateway: deerflow.local/deer-flow-gateway:20260914-enterprise-arm64-rc15-digitalemployee-promptfix1
    deer-flow-ppt-master-runner: deerflow.local/deer-flow-gateway:20260907-enterprise-arm64-rc15-skillhubux-dashboard1-r2
    deer-flow-frontend: deerflow.local/deer-flow-frontend:20260914-enterprise-arm64-rc15-digitalemployee-ui2-r1
    deer-flow-provisioner: deerflow.local/deer-flow-provisioner:20260817-enterprise-arm64-rc15-sandboxstorage1
    deer-flow-skills: deerflow.local/deer-flow-skills:20260901-enterprise-arm64-rc15-researchfund1
    deer-flow-mineru-adapter: deerflow.local/deer-flow-mineru-adapter:20260915-enterprise-arm64-rc15-uploadstability2
  runtime_images:
    deer-flow-aio-sandbox: deerflow.local/deer-flow-aio-sandbox:20260817-enterprise-arm64-rc15-sandboxstorage1
  separately_managed_images:
    skillhub-server: deerflow.local/skillhub-server:20260908-enterprise-arm64-rc15-skillhubsession2
    skillhub-web: deerflow.local/skillhub-web:20260907-enterprise-arm64-rc15-skillhubux-dashboard1-r2
  capabilities:
    deerflow_browser_live: enabled
    deerflow_digital_employees: enabled
    oa_policy_flow: polling-enabled-callback-disabled
    weknora_v08: enabled
    weknora_anydoc: enabled-with-existing-xlsx-route-freeze
    weknora_sandbox: disabled-not-in-production
    skillhub: enabled-separately-managed

controls:
  - id: ppt-master.failure-isolation
    layer: kubernetes+routing
    source:
      - k8s/local-pvc/deer-flow-pvc-stack.yaml
      - k8s/enterprise/runtime-patches.yaml
      - docs/ppt-master-isolated-runner.md
    enforcement: offline+live+functional
    acceptance: Gateway and ppt-master-runner use different Deployments, Pods, Services, and image keys; the runner requires three consecutive PostgreSQL readiness samples, and a runner restart does not remove the ordinary Gateway endpoint.

  - id: gateway.memory-headroom
    layer: kubernetes
    source:
      - k8s/enterprise/runtime-patches.yaml
    enforcement: offline+live
    acceptance: Gateway keeps its 4Gi request and has a 16Gi limit, with post-rollout OOM counters monitored independently from PPT Runner health.

  - id: model.deepseek-only
    layer: runtime-config
    source:
      - config.yaml
    enforcement: offline
    acceptance: DeerFlow exposes only deepseek-v4-flash, keeps its audited 1M input context with a 65536-token output ceiling, and uses it for scheduled runs, summaries, memory, and input polishing.

  - id: sandbox.command-proxy
    layer: runtime-config
    source:
      - config.yaml
    enforcement: offline+live
    acceptance: Both proxy-variable cases resolve from the Gateway runtime environment for every Sandbox command.

  - id: sandbox.egress-ca
    layer: kubernetes
    source:
      - k8s/enterprise/runtime-patches.yaml
      - docker/provisioner/app.py
    enforcement: offline+live
    acceptance: Provisioner-created Sandbox Pods receive proxy variables, enterprise CA, scoped OpenSSL compatibility, and no service-account token.

  - id: sandbox.shared-thread-data
    layer: runtime-config+kubernetes
    source:
      - config.yaml
      - k8s/local-pvc/deer-flow-pvc-stack.yaml
      - docker/provisioner/app.py
    enforcement: offline+live+functional
    acceptance: Gateway and provisioner-created Sandbox Pods mount the same thread-scoped user-data PVC, and uploads never cold-start or wait for a Sandbox merely to copy bytes.

  - id: external.dashscope-image
    layer: runtime-config
    source:
      - config.yaml
      - k8s/enterprise/runtime-patches.yaml
    enforcement: offline+live+functional
    acceptance: image-generation uses DashScope through the verified proxy and Gemini is not injected.

  - id: external.tavily
    layer: kubernetes
    source:
      - k8s/enterprise/runtime-patches.yaml
    enforcement: offline+live+functional
    acceptance: Tavily uses scoped TLS compatibility through the enterprise proxy.

  - id: images.immutable-arm64
    layer: images
    source:
      - k8s/enterprise/kustomization.yaml
    enforcement: offline
    acceptance: Third-party images use reviewed digests and custom images use immutable deerflow.local tags with imagePullPolicy Never.

  - id: database.pg-search-arm64
    layer: kubernetes
    source:
      - k8s/enterprise/kustomization.yaml
      - k8s/weknora/weknora.yaml
    enforcement: offline+live
    acceptance: WeKnora PostgreSQL uses the local ARM64 PG16 pg_search image rather than the incompatible upstream ParadeDB image.

  - id: storage.static-local-pv
    layer: storage
    source:
      - k8s/enterprise/storage-patches.yaml
      - k8s/enterprise/storage-static.yaml
    enforcement: offline+live
    acceptance: PostgreSQL retains ReadWriteOnce and all stateful data remains bound to the audited node-local volumes.

  - id: mineru.three-node-safe-parallelism
    layer: kubernetes
    source:
      - k8s/enterprise/mineru-adapter.yaml
      - k8s/enterprise/mineru-adapter-patch.yaml
      - k8s/enterprise/runtime-patches.yaml
    enforcement: offline+live+functional
    acceptance: Three anti-affined adapter Pods run one per node, PDB minAvailable is two, and WeKnora worker concurrency remains 2+1.

  - id: mineru.visual-documents
    layer: parser
    source:
      - docker/mineru_adapter/app.py
      - k8s/enterprise/mineru-adapter.yaml
      - k8s/enterprise/mineru-adapter-patch.yaml
      - k8s/enterprise/weknora-mineru-defaults.sql
    enforcement: offline+functional
    acceptance: Searchable and scanned PDFs, Word, and presentations retain text plus retrievable visual evidence without unsafe in-process parser concurrency.

  - id: weknora.official-ui-resource-images
    layer: images
    source:
      - k8s/enterprise/kustomization.yaml
    enforcement: offline+functional
    acceptance: WeKnora UI remains on the reviewed official digest that supports authenticated resource images.

  - id: weknora.internal-model-defaults
    layer: database-job
    source:
      - k8s/enterprise/builtin-models-internal-only.yaml
      - k8s/weknora/enterprise-model-feature-defaults.sql
      - k8s/weknora/enterprise-model-feature-defaults-job.yaml
      - k8s/enterprise/runtime-patches.yaml
    enforcement: offline+live+functional
    acceptance: DeepSeek-V4-Flash, internal Qwen3 embedding/rerank, enterprise VLM, and ASR defaults are installed idempotently.

  - id: weknora.internal-relay-ssrf
    layer: kubernetes
    source:
      - k8s/enterprise/runtime-patches.yaml
    enforcement: offline+live
    acceptance: Exact internal hosts and the authenticated Gateway relay are allowed without broad private-network SSRF exemptions.

  - id: weknora.neo4j
    layer: kubernetes
    source:
      - k8s/weknora/weknora.yaml
      - k8s/enterprise/storage-patches.yaml
    enforcement: offline+live+functional
    acceptance: Graph RAG uses the DeerFlow-owned Neo4j instance with persistent storage and Secret-backed credentials.

  - id: weknora.same-origin-sso-ui
    layer: routing
    source:
      - k8s/local-pvc/nginx.conf
      - k8s/enterprise/runtime-patches.yaml
      - k8s/weknora/kustomization.yaml
    enforcement: offline+functional
    acceptance: The embedded workspace, SSO session, resource files, and UI patches remain same-origin without fixed ClusterIP or loopback browser URLs.

  - id: nginx.frontend-api-order
    layer: routing
    source:
      - k8s/local-pvc/nginx.conf
    enforcement: offline+functional
    acceptance: Runtime config, external-agent launch, and shop-cart routes reach Frontend before the generic Gateway API catch-all.

  - id: exposure.single-nodeport
    layer: kubernetes
    source:
      - k8s/enterprise/nginx-nodeport.yaml
    enforcement: offline+live
    acceptance: The only public application entry is Nginx NodePort 32026.

  - id: scheduler.bounded-recursion
    layer: runtime-config
    source:
      - config.yaml
    enforcement: offline+functional
    acceptance: Scheduler is enabled with recursion_limit 300 and bounded concurrent execution.

  - id: security.platform-boundary
    layer: source
    source:
      - backend/packages/harness/deerflow/agents/middlewares/platform_confidentiality_middleware.py
      - backend/packages/harness/deerflow/agents/middlewares/sandbox_audit_middleware.py
      - docker/provisioner/app.py
    enforcement: offline+tests
    acceptance: Conversational workloads cannot inspect platform state, credentials, cluster APIs, or platform databases.

  - id: security.file-boundary
    layer: source
    source:
      - backend/app/gateway/file_security.py
      - backend/app/gateway/routers/uploads.py
      - backend/app/gateway/routers/artifacts.py
    enforcement: offline+tests
    acceptance: Active upload types are rejected and generated or uploaded documents use hardened delivery policies.

  - id: dashboard.audit-history
    layer: source+database
    source:
      - backend/app/gateway/routers/dashboard.py
      - backend/app/gateway/dashboard_database.py
      - backend/app/gateway/dashboard_rollups.py
      - backend/packages/harness/deerflow/persistence/migrations/versions/0017_dashboard_hourly_rollups.py
      - backend/app/gateway/external_agent_analytics.py
      - frontend/src/app/workspace/admin/dashboard/page.tsx
      - k8s/enterprise/dashboard-postgres-replica.yaml
      - k8s/local-pvc/dashboard-rollup-cronjob.yaml
    enforcement: tests+functional
    acceptance: Dashboard current-state and cumulative audit metrics remain distinct, 24-hour reads use hourly facts, and enterprise dashboard reads fail closed onto a verified physical standby without primary fallback.

  - id: operations.backup-before-rollout
    layer: operations
    source:
      - k8s/enterprise/README.md
    enforcement: manual
    acceptance: Kubernetes objects, both PostgreSQL databases, ConfigMaps, and non-secret Secret inventories are captured before mutation.

manual_acceptance:
  - id: local-bailian-smoke
    action: Use a separate local-only Bailian test configuration to validate the user flows when internal DeepSeek is unreachable; do not copy Bailian models into the enterprise release config.
  - id: sso
    action: Validate data-lake SSO as one administrator and one ordinary user.
  - id: chat
    action: Run a new DeepSeek conversation and verify title, summary, memory, and scheduled execution.
  - id: knowledge
    action: Parse searchable PDF, scanned PDF, DOCX, PPTX, and image files; query text and images from WeKnora and DeerFlow.
  - id: external-network
    action: Run Tavily web search and DashScope image-generation from a new DeerFlow Sandbox.
  - id: external-agents
    action: Verify all five allowlisted external-agent redirects with the current HttpOnly SSO token.
  - id: dashboard
    action: Verify current and cumulative WeKnora, scheduled-task, conversation, file, and external-click metrics; prove the dashboard connection reports pg_is_in_recovery()=true and transaction_read_only=on, replica lag is bounded, 24-hour responses use hourly_rollup, and stopping the replica affects only the dashboard.
  - id: browser
    action: Verify the audited enterprise browser renders settings, human-input cards, Skill chips, schedule dialogs, and dashboard bars without opaque fallback blocks.
  - id: security
    action: Verify dangerous upload rejection, hardened document delivery, administrator cross-user read-only mode, and absence of credentials in browser responses and logs.
  - id: graph
    action: Create or reuse a graph-enabled knowledge base and verify Neo4j-backed graph retrieval without exposing graph credentials.
  - id: parser-load
    action: Run 3-, 10-, and 30-document upload batches and confirm three anti-affined MinerU adapters remain healthy while excess work queues in WeKnora.
