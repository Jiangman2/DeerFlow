---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: deerflow-home-pv-datax-01
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: deerflow-home-local
  volumeMode: Filesystem
  local:
    path: /opt/deerflow-storage/home
    fsType: xfs
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [datax-01]
---
