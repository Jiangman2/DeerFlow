apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: deer-flow

resources:
  - ../local-pvc
  - ../weknora
  - nginx-nodeport.yaml
  - storage-static.yaml
  - mineru-adapter.yaml
  - gateway-openssl-compat.yaml

configMapGenerator:
  - name: weknora-config
    behavior: merge
    files:
      - builtin_models.yaml=builtin-models-internal-only.yaml

patches:
  - path: storage-patches.yaml
  - path: runtime-patches.yaml

# Third-party images are the ARM64 manifests verified on datax-01 on
# 2026-07-21. Custom images use immutable deployment tags and are imported
# into the k8s.io containerd namespace on every node before apply. The custom
# WeKnora PostgreSQL image was rebuilt and smoke-tested on datax-01/datax-02
# because the upstream ParadeDB PG17 image uses instructions unavailable on
# these nodes.
images:
  - name: busybox
    newName: m.daocloud.io/docker.io/library/busybox
    digest: sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
  - name: nginx
    newName: m.daocloud.io/docker.io/library/nginx
    digest: sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
  - name: postgres
    newName: m.daocloud.io/docker.io/library/postgres
    digest: sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
  - name: redis
    newName: m.daocloud.io/docker.io/library/redis
    digest: sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
  - name: neo4j
    newName: m.daocloud.io/docker.io/library/neo4j
    digest: sha256:155c8aad10d5c838bc3bbc476c0418779086547822acb214ec5e3d49ba336907
  - name: paradedb/paradedb
    newName: deerflow.local/weknora-postgres
    newTag: pg16-search-arm64-20260722-1
  - name: wechatopenai/weknora-app
    newName: deerflow.local/weknora-app
    newTag: 0.7.0-enterprise-proxy1-arm64-20260723
  - name: wechatopenai/weknora-docreader
    newName: m.daocloud.io/docker.io/wechatopenai/weknora-docreader
    digest: sha256:65d9a4a4fb7b2d3c065eb8eabe033d1f001cedfd039be7f2355540ecad7da57b
  - name: wechatopenai/weknora-ui
