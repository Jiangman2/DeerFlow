    digest: sha256:401604e79a5717dd966a13383d775f15d3125481d3e080eba329e4a0fbcf9523
  - name: deer-flow-gateway
    newName: deerflow.local/deer-flow-gateway
    newTag: 20260728-enterprise-arm64-rc11
  - name: deer-flow-frontend
    newName: deerflow.local/deer-flow-frontend
    newTag: 20260728-enterprise-arm64-rc11
  - name: deer-flow-provisioner
    newName: deerflow.local/deer-flow-provisioner
