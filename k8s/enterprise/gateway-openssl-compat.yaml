apiVersion: v1
kind: ConfigMap
metadata:
  name: deer-flow-gateway-openssl-compat
  namespace: deer-flow
data:
  openssl.cnf: |
    openssl_conf = deerflow_init

    [deerflow_init]
    ssl_conf = deerflow_ssl

    [deerflow_ssl]
    system_default = deerflow_system_default

    [deerflow_system_default]
    CipherString = DEFAULT:@SECLEVEL=1
