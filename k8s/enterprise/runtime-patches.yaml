              value: https://datalake.cnooc/#/home
            - name: DEER_FLOW_SSO_ONLY
              value: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weknora-docreader
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: docreader
          env:
            # URL knowledge imports are rendered by DocReader's Playwright
            # WebKit process.  It intentionally consumes these dedicated
            # variables rather than the conventional HTTP(S)_PROXY names.
            - name: DOCREADER_EXTERNAL_HTTP_PROXY
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: HTTP_PROXY
            - name: DOCREADER_EXTERNAL_HTTPS_PROXY
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: HTTPS_PROXY
            # The browser subprocess inherits this verified enterprise bundle
            # when the egress proxy inspects TLS.  File parsing remains local;
            # these settings affect only outbound URL/subresource retrieval.
            - name: SSL_CERT_FILE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: CURL_CA_BUNDLE
              value: /etc/deerflow-ca/ca-bundle.crt
          volumeMounts:
            - name: enterprise-ca
              mountPath: /etc/deerflow-ca
              readOnly: true
      volumes:
        - name: enterprise-ca
          secret:
            secretName: deer-flow-enterprise-ca
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weknora-app
  namespace: deer-flow
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: app
          imagePullPolicy: Never
          env:
            - name: SSL_CERT_FILE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: CURL_CA_BUNDLE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: EMBEDDING_BASE_URL
              value: http://gateway:8001/api/weknora/bailian/v1
            - name: EMBEDDING_PROVIDER
              value: generic
            - name: WEKNORA_PREFER_CNOOC_DEEPSEEK
              value: "true"
            # Six adapter Pods each serialize native parsing in-process. Four
            # core workers plus two shared workers cap active parser calls at
            # six; later uploads remain durable in WeKnora's Redis queue.
            - name: WEKNORA_ASYNQ_CORE_CONCURRENCY
              value: "4"
            # Keep document parsing capped independently while allowing the
            # model-heavy image/summary/graph/question fan-out to drain on its
            # dedicated WeKnora v0.8 enrichment pool.
            - name: WEKNORA_ASYNQ_POSTPROCESS_CONCURRENCY
              value: "2"
            - name: WEKNORA_ASYNQ_ENRICHMENT_CONCURRENCY
              value: "12"
            - name: WEKNORA_ASYNQ_MAINTENANCE_CONCURRENCY
              value: "4"
            - name: WEKNORA_ASYNQ_SHARED_CONCURRENCY
              value: "2"
            - name: WEKNORA_DOCREADER_CALL_TIMEOUT
              value: 30m
            - name: WEKNORA_DOCUMENT_PROCESS_TIMEOUT
              value: 2h
            - name: WEKNORA_INTERNAL_MODEL_RELAY_KEY
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: WEKNORA_INTERNAL_MODEL_RELAY_KEY
            - name: NO_PROXY
              value: "localhost,127.0.0.1,::1,gateway,weknora-app,weknora-frontend,weknora-docreader,weknora-postgres,weknora-redis,deer-flow-mineru-adapter,model.ai.cnooc,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16,192.168.111.0/24"
            - name: no_proxy
              value: "localhost,127.0.0.1,::1,gateway,weknora-app,weknora-frontend,weknora-docreader,weknora-postgres,weknora-redis,deer-flow-mineru-adapter,model.ai.cnooc,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16,192.168.111.0/24"
            - name: SSRF_WHITELIST_EXTRA
              value: deer-flow-mineru-adapter,model.ai.cnooc,gateway
          volumeMounts:
            - name: enterprise-ca
              mountPath: /etc/deerflow-ca
              readOnly: true
      volumes:
        - name: enterprise-ca
          secret:
            secretName: deer-flow-enterprise-ca
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
---
apiVersion: batch/v1
kind: Job
metadata:
  name: weknora-enterprise-model-defaults-v5
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: apply-defaults
          env:
            - name: DEFAULT_CHAT_MODEL_ID
              value: deerflow-cnooc-deepseek-v4-flash
            - name: DEFAULT_EMBEDDING_MODEL_ID
              value: deerflow-cnooc-qwen3-embedding-8b
            - name: DEFAULT_RERANK_MODEL_ID
              value: deerflow-cnooc-qwen3-reranker-8b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weknora-redis
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: redis
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weknora-redis-data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weknora-postgres
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: postgres
          imagePullPolicy: Never
          args:
            - -c
            - shared_preload_libraries=pg_search
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dashboard-rollup-maintenance
  namespace: deer-flow
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: dashboard-rollup-maintenance
              imagePullPolicy: Never
              env:
                - name: DEER_FLOW_DASHBOARD_REQUIRE_READ_REPLICA
                  value: "true"
                - name: DEER_FLOW_DASHBOARD_VERIFY_READ_REPLICA
                  value: "true"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: postgres
          args:
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=4
            - -c
            - max_replication_slots=4
            - -c
            - wal_keep_size=512MB
            - -c
            - max_slot_wal_keep_size=4GB
            - -c
            - hba_file=/etc/postgresql/replication/pg_hba.conf
          volumeMounts:
            - name: replication-config
              mountPath: /etc/postgresql/replication
              readOnly: true
      volumes:
        - name: replication-config
          configMap:
            name: deer-flow-postgres-replication
