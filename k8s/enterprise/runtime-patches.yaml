apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: frontend
          imagePullPolicy: Never
          env:
            - name: WEKNORA_FRONTEND_URL
              value: /platform/knowledge-bases
            - name: DEER_FLOW_UNAUTHENTICATED_HOME_URL
              value: https://datalake.cnooc/#/home
            - name: DEER_FLOW_SSO_ONLY
              value: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weknora-app
  namespace: deer-flow
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: app
          imagePullPolicy: Never
          env:
            - name: SSL_CERT_FILE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: CURL_CA_BUNDLE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: EMBEDDING_BASE_URL
              value: http://gateway:8001/api/weknora/bailian/v1
            - name: EMBEDDING_PROVIDER
              value: generic
            - name: WEKNORA_PREFER_CNOOC_DEEPSEEK
              value: "true"
            # The three adapter Pods each serialize native parsing in-process.
            # Two dedicated core workers plus one elastic shared worker cap
            # active parser calls at three; later uploads stay durable in
            # WeKnora's Redis/Asynq queue instead of filling adapter memory.
            - name: WEKNORA_ASYNQ_CORE_CONCURRENCY
              value: "2"
            - name: WEKNORA_ASYNQ_SHARED_CONCURRENCY
              value: "1"
            - name: WEKNORA_DOCREADER_CALL_TIMEOUT
              value: 30m
            - name: WEKNORA_DOCUMENT_PROCESS_TIMEOUT
              value: 2h
            - name: WEKNORA_INTERNAL_MODEL_RELAY_KEY
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: WEKNORA_INTERNAL_MODEL_RELAY_KEY
            - name: NO_PROXY
              value: "localhost,127.0.0.1,::1,gateway,weknora-app,weknora-frontend,weknora-docreader,weknora-postgres,weknora-redis,deer-flow-mineru-adapter,model.ai.cnooc,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16,192.168.111.0/24"
            - name: no_proxy
              value: "localhost,127.0.0.1,::1,gateway,weknora-app,weknora-frontend,weknora-docreader,weknora-postgres,weknora-redis,deer-flow-mineru-adapter,model.ai.cnooc,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16,192.168.111.0/24"
            - name: SSRF_WHITELIST_EXTRA
              value: deer-flow-mineru-adapter,model.ai.cnooc,gateway
          volumeMounts:
            - name: enterprise-ca
              mountPath: /etc/deerflow-ca
              readOnly: true
      volumes:
        - name: enterprise-ca
          secret:
            secretName: deer-flow-enterprise-ca
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
---
apiVersion: batch/v1
kind: Job
metadata:
  name: weknora-enterprise-model-defaults-v5
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: apply-defaults
          env:
            - name: DEFAULT_CHAT_MODEL_ID
              value: deerflow-cnooc-deepseek-v4-flash
            - name: DEFAULT_EMBEDDING_MODEL_ID
              value: deerflow-cnooc-qwen3-embedding-8b
            - name: DEFAULT_RERANK_MODEL_ID
              value: deerflow-cnooc-qwen3-reranker-8b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weknora-redis
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: redis
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weknora-redis-data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weknora-postgres
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: postgres
          imagePullPolicy: Never
          args:
            - -c
            - shared_preload_libraries=pg_search
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
