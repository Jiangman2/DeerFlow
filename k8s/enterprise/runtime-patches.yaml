apiVersion: v1
kind: Service
metadata:
  name: weknora-app-nodeport
  namespace: deer-flow
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: weknora-frontend-nodeport
  namespace: deer-flow
$patch: delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: skills-sync
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: sync
          imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioner
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: provisioner
          imagePullPolicy: Never
          env:
            - name: SANDBOX_IMAGE
              value: deerflow.local/deer-flow-aio-sandbox:20260723-enterprise-arm64-rc3
            - name: SANDBOX_SERVICE_TYPE
              value: ClusterIP
            - name: SANDBOX_SECRET_ENV_KEYS
              value: DASHSCOPE_API_KEY,PEXELS_API_KEY,PIXABAY_API_KEY,GEMINI_API_KEY,SANDBOX_API_KEY
            - name: IMAGE_BACKEND
              value: dashscope
            - name: IMAGE_GENERATION_PROVIDER
              value: dashscope
            - name: DASHSCOPE_BASE_URL
              value: https://dashscope.aliyuncs.com/api/v1
            - name: DASHSCOPE_IMAGE_MODEL
              value: qwen-image-2.0-pro
            - name: VIDEO_GENERATION_PROVIDER
              value: dashscope
            - name: DASHSCOPE_VIDEO_MODEL
              value: wan2.7-t2v
            - name: DASHSCOPE_VIDEO_DURATION
              value: "5"
            - name: DASHSCOPE_VIDEO_RESOLUTION
              value: 720P
            - name: PODCAST_GENERATION_PROVIDER
              value: dashscope
            - name: DASHSCOPE_TTS_MODEL
              value: qwen3-tts-flash
            - name: DASHSCOPE_TTS_VOICE_MALE
              value: Ethan
            - name: DASHSCOPE_TTS_VOICE_FEMALE
              value: Cherry
            - name: MUSIC_GENERATION_PROVIDER
              value: dashscope
            - name: DASHSCOPE_MUSIC_MODEL
              value: fun-music-v1
            - name: DASHSCOPE_MUSIC_GENDER
              value: female
            - name: DASHSCOPE_MUSIC_FORMAT
              value: mp3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: gateway
          imagePullPolicy: Never
          env:
            - name: SSL_CERT_FILE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: CURL_CA_BUNDLE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: NO_PROXY
              value: "localhost,127.0.0.1,::1,gateway,provisioner,nginx,weknora-app,weknora-frontend,weknora-docreader,weknora-postgres,weknora-redis,deer-flow-mineru-adapter,model.ai.cnooc,datalake.cnooc,10.77.78.223,host.docker.internal,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16,192.168.111.0/24"
            - name: no_proxy
              value: "localhost,127.0.0.1,::1,gateway,provisioner,nginx,weknora-app,weknora-frontend,weknora-docreader,weknora-postgres,weknora-redis,deer-flow-mineru-adapter,model.ai.cnooc,datalake.cnooc,10.77.78.223,host.docker.internal,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16,192.168.111.0/24"
            - name: OPENSSL_CONF
              value: /etc/deerflow-openssl/openssl.cnf
            - name: WEKNORA_BAILIAN_TLS_COMPAT
              value: "true"
            - name: TAVILY_TLS_COMPAT
              value: "true"
            - name: WEKNORA_ENTERPRISE_INTERNAL_MODELS_ONLY
              value: "true"
            - name: WEKNORA_DEFAULT_EMBEDDING_MODEL_ID
              value: deerflow-cnooc-qwen3-embedding-8b
            - name: WEKNORA_DEFAULT_RERANK_MODEL_ID
              value: deerflow-cnooc-qwen3-reranker-8b
            - name: CNOOC_EMBEDDING_DIMENSION
              value: "1024"
            - name: CNOOC_EMBEDDING_MRL_TRUNCATION_ENABLED
              value: "true"
            - name: CNOOC_RETRIEVAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: CNOOC_RETRIEVAL_API_KEY
            - name: WEKNORA_INTERNAL_MODEL_RELAY_KEY
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: WEKNORA_INTERNAL_MODEL_RELAY_KEY
            - name: EMBEDDING_BASE_URL
              value: http://gateway:8001/api/weknora/bailian/v1
            - name: EMBEDDING_PROVIDER
              value: generic
            - name: WEKNORA_PRESENTATION_PARSER_ENGINE
              value: mineru
            - name: WEKNORA_MINERU_ENDPOINT
              value: http://deer-flow-mineru-adapter:50052
            - name: WEKNORA_MINERU_AUTO_CONFIGURE
              value: "true"
            - name: WEKNORA_MINERU_SCANNED_PDF_FALLBACK
              value: "true"
          volumeMounts:
            - name: enterprise-ca
              mountPath: /etc/deerflow-ca
              readOnly: true
            - name: openssl-compat
              mountPath: /etc/deerflow-openssl
              readOnly: true
      volumes:
        - name: enterprise-ca
          secret:
            secretName: deer-flow-enterprise-ca
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
        - name: openssl-compat
          configMap:
            name: deer-flow-gateway-openssl-compat
            items:
              - key: openssl.cnf
                path: openssl.cnf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: frontend
          imagePullPolicy: Never
          env:
            - name: WEKNORA_FRONTEND_URL
              value: /platform/knowledge-bases
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weknora-app
  namespace: deer-flow
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: app
          imagePullPolicy: Never
          env:
            - name: SSL_CERT_FILE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: CURL_CA_BUNDLE
              value: /etc/deerflow-ca/ca-bundle.crt
            - name: EMBEDDING_BASE_URL
              value: http://gateway:8001/api/weknora/bailian/v1
            - name: EMBEDDING_PROVIDER
              value: generic
            - name: WEKNORA_PREFER_CNOOC_DEEPSEEK
              value: "true"
            - name: WEKNORA_INTERNAL_MODEL_RELAY_KEY
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: WEKNORA_INTERNAL_MODEL_RELAY_KEY
            - name: NO_PROXY
              value: "localhost,127.0.0.1,::1,gateway,weknora-app,weknora-frontend,weknora-docreader,weknora-postgres,weknora-redis,deer-flow-mineru-adapter,model.ai.cnooc,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16,192.168.111.0/24"
            - name: no_proxy
              value: "localhost,127.0.0.1,::1,gateway,weknora-app,weknora-frontend,weknora-docreader,weknora-postgres,weknora-redis,deer-flow-mineru-adapter,model.ai.cnooc,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16,192.168.111.0/24"
            - name: SSRF_WHITELIST_EXTRA
              value: deer-flow-mineru-adapter,model.ai.cnooc,gateway
          volumeMounts:
            - name: enterprise-ca
              mountPath: /etc/deerflow-ca
              readOnly: true
      volumes:
        - name: enterprise-ca
          secret:
            secretName: deer-flow-enterprise-ca
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
---
apiVersion: batch/v1
kind: Job
metadata:
  name: weknora-enterprise-model-defaults-v5
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: apply-defaults
          env:
            - name: DEFAULT_CHAT_MODEL_ID
              value: deerflow-cnooc-deepseek-v4-flash
            - name: DEFAULT_EMBEDDING_MODEL_ID
              value: deerflow-cnooc-qwen3-embedding-8b
            - name: DEFAULT_RERANK_MODEL_ID
              value: deerflow-cnooc-qwen3-reranker-8b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weknora-redis
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: redis
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weknora-redis-data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weknora-postgres
  namespace: deer-flow
spec:
  template:
    spec:
      containers:
        - name: postgres
          imagePullPolicy: Never
          args:
            - -c
            - shared_preload_libraries=pg_search
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
