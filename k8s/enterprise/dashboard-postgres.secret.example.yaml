apiVersion: v1
kind: Secret
metadata:
  name: deer-flow-dashboard-postgres
  namespace: deer-flow
type: Opaque
stringData:
  REPLICATION_USER: deerflow_dashboard_replica
  REPLICATION_PASSWORD: replace-with-independent-replication-password
  DASHBOARD_USER: deerflow_dashboard
  DASHBOARD_PASSWORD: replace-with-independent-dashboard-password
  DATABASE_URL: postgresql://deerflow_dashboard:replace-with-independent-dashboard-password@postgres-dashboard-replica:5432/deerflow
