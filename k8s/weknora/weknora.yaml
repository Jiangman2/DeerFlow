apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weknora-postgres-data
  namespace: deer-flow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weknora-data-files
  namespace: deer-flow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weknora-docreader-tmp
  namespace: deer-flow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weknora-postgres
  namespace: deer-flow
spec:
  serviceName: weknora-postgres
  replicas: 1
  selector:
    matchLabels:
      app: weknora-postgres
  template:
    metadata:
      labels:
        app: weknora-postgres
    spec:
      containers:
        - name: postgres
          image: paradedb/paradedb:v0.22.2-pg17
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weknora-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: WeKnora
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weknora-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: weknora-postgres
  namespace: deer-flow
spec:
  selector:
    app: weknora-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weknora-redis
  namespace: deer-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weknora-redis
  template:
    metadata:
      labels:
        app: weknora-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.11-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD" --cluster-enabled no --cluster-port 0 --protected-mode yes
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weknora-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: weknora-redis
  namespace: deer-flow
spec:
  selector:
    app: weknora-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weknora-docreader
  namespace: deer-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weknora-docreader
  template:
    metadata:
      labels:
        app: weknora-docreader
    spec:
      containers:
        - name: docreader
          image: wechatopenai/weknora-docreader@sha256:65d9a4a4fb7b2d3c065eb8eabe033d1f001cedfd039be7f2355540ecad7da57b
          imagePullPolicy: IfNotPresent
          env:
            - name: MAX_FILE_SIZE_MB
              value: "100"
            - name: DOCREADER_IMAGE_OUTPUT_DIR
              value: /tmp/docreader
            - name: PYTHONPATH
              value: /opt/deerflow-compat
            - name: DOCREADER_ODL_MAX_WORKERS
              value: "1"
            - name: DOCREADER_MARKITDOWN_MAX_WORKERS
              value: "1"
            - name: DOCREADER_PDF_RENDER_MAX_WORKERS
              value: "1"
          ports:
            - containerPort: 50051
              name: grpc
          volumeMounts:
            - name: tmp
              mountPath: /tmp/docreader
            - name: xlsx-compat
              mountPath: /opt/deerflow-compat
              readOnly: true
            # Playwright remains the fallback for genuinely dynamic pages.
            # Give that browser an isolated shared-memory filesystem instead
            # of the container runtime's small default /dev/shm mount.
            - name: browser-shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          persistentVolumeClaim:
            claimName: weknora-docreader-tmp
        - name: xlsx-compat
          configMap:
            name: weknora-docreader-xlsx-compat
        - name: browser-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: weknora-docreader
  namespace: deer-flow
spec:
  selector:
    app: weknora-docreader
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weknora-neo4j-data
  namespace: deer-flow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weknora-neo4j
  namespace: deer-flow
spec:
  serviceName: weknora-neo4j
  replicas: 1
  selector:
    matchLabels:
      app: weknora-neo4j
  template:
    metadata:
      labels:
        app: weknora-neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:2025.10.1
          imagePullPolicy: IfNotPresent
          env:
            # Do not name this helper NEO4J_PASSWORD. The Neo4j entrypoint
            # interprets every NEO4J_* variable as a server setting.
            - name: DEERFLOW_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weknora-neo4j-secret
                  key: NEO4J_PASSWORD
            - name: NEO4J_AUTH
              value: neo4j/$(DEERFLOW_NEO4J_PASSWORD)
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_apoc_export_file_enabled
              value: "true"
            - name: NEO4J_apoc_import_file_enabled
              value: "true"
            - name: NEO4J_apoc_import_file_use__neo4j__config
              value: "true"
            - name: NEO4J_server_memory_heap_initial__size
              value: 256m
            - name: NEO4J_server_memory_heap_max__size
              value: 512m
            - name: NEO4J_server_memory_pagecache_size
              value: 256m
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weknora-neo4j-data
---
apiVersion: v1
kind: Service
metadata:
  name: weknora-neo4j
  namespace: deer-flow
spec:
  selector:
    app: weknora-neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weknora-app
  namespace: deer-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weknora-app
  template:
    metadata:
      labels:
        app: weknora-app
    spec:
      containers:
        - name: app
          image: wechatopenai/weknora-app@sha256:500262dfee6e10e759cde8726d75e159e9c78bd3e79bcea49e12271fc73f1ef3
          imagePullPolicy: IfNotPresent
          env:
            - name: MAX_FILE_SIZE_MB
              value: "100"
            - name: GIN_MODE
              value: release
            - name: LOG_LEVEL
              value: info
            - name: TZ
              value: Asia/Shanghai
            - name: WEKNORA_LANGUAGE
              value: zh-CN
            - name: DISABLE_REGISTRATION
              value: "false"
            # DeerFlow SSO creates one personal workspace on first login.
            # Ordinary users may join shared spaces, but cannot self-create
            # additional tenant workspaces. Cross-tenant system admins are
            # exempt in WeKnora 0.7.0 and retain full workspace management.
            - name: WEKNORA_AUTH_DEFAULT_TENANT_MODE
              value: create_personal
            - name: WEKNORA_TENANT_ENABLE_RBAC
              value: "true"
            - name: WEKNORA_TENANT_SELF_SERVICE_CREATION_ENABLED
              value: "false"
            - name: WEKNORA_TENANT_MAX_OWNED_PER_USER
              value: "1"
            - name: DB_DRIVER
              value: postgres
            - name: DB_HOST
              value: weknora-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weknora-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              value: WeKnora
            - name: RETRIEVE_DRIVER
              value: postgres
            - name: STORAGE_TYPE
              value: local
            - name: LOCAL_STORAGE_BASE_DIR
              value: /data/files
            - name: STREAM_MANAGER_TYPE
              value: redis
            - name: REDIS_ADDR
              value: weknora-redis:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weknora-secret
                  key: REDIS_PASSWORD
            - name: DOCREADER_ADDR
              value: weknora-docreader:50051
            - name: DOCREADER_TRANSPORT
              value: grpc
            - name: ENABLE_GRAPH_RAG
              value: "true"
            - name: NEO4J_ENABLE
              value: "true"
            - name: NEO4J_URI
              value: bolt://weknora-neo4j:7687
            - name: NEO4J_USERNAME
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weknora-neo4j-secret
                  key: NEO4J_PASSWORD
            - name: TENANT_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: weknora-secret
                  key: TENANT_AES_KEY
            - name: SYSTEM_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: weknora-secret
                  key: SYSTEM_AES_KEY
            # Keep WeKnora access/refresh tokens valid across pod restarts.
            # Reuse the existing stable 32-byte deployment secret rather than
            # allowing the application to generate an ephemeral JWT key.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: weknora-secret
                  key: SYSTEM_AES_KEY
            - name: LLM_MODEL_NAME
              value: qwen-plus
            - name: LLM_BASE_URL
              value: https://dashscope.aliyuncs.com/compatible-mode/v1
            - name: LLM_PROVIDER
              value: aliyun
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weknora-secret
                  key: LLM_API_KEY
            - name: DeepSeek_V4_API_KEY
              valueFrom:
                secretKeyRef:
                  name: deer-flow-env
                  key: DeepSeek_V4_API_KEY
                  optional: true
            - name: EMBEDDING_MODEL_NAME
              value: text-embedding-v4
            - name: EMBEDDING_BASE_URL
              value: http://gateway:8001/api/weknora/bailian/v1
            - name: EMBEDDING_PROVIDER
              value: generic
            # A developer workstation may resolve the enterprise model host
            # without having a healthy route to its upstream inference service.
            # The enterprise overlay explicitly restores this preference.
            - name: WEKNORA_PREFER_CNOOC_DEEPSEEK
              value: "false"
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weknora-secret
                  key: EMBEDDING_API_KEY
            # The embedding/ASR built-ins call the authenticated Gateway
            # relay by its Kubernetes Service name. KnowledgeQA may call the
            # reviewed internal model endpoint directly. Permit only these
            # exact private hostnames through WeKnora's SSRF guard.
            - name: SSRF_WHITELIST_EXTRA
              value: model.ai.cnooc,gateway
            - name: NO_PROXY
              value: localhost,127.0.0.1,gateway,weknora-postgres,weknora-redis,weknora-docreader,weknora-neo4j,model.ai.cnooc,.svc,.cluster.local
            - name: no_proxy
              value: localhost,127.0.0.1,gateway,weknora-postgres,weknora-redis,weknora-docreader,weknora-neo4j,model.ai.cnooc,.svc,.cluster.local
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/config/builtin_models.yaml
              subPath: builtin_models.yaml
              readOnly: true
            - name: config
              mountPath: /app/config/builtin_agents.yaml
              subPath: builtin_agents.yaml
              readOnly: true
            - name: data-files
              mountPath: /data/files
            - name: docreader-tmp
              mountPath: /tmp/docreader
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
      volumes:
        - name: config
          configMap:
            name: weknora-config
        - name: data-files
          persistentVolumeClaim:
            claimName: weknora-data-files
        - name: docreader-tmp
          persistentVolumeClaim:
            claimName: weknora-docreader-tmp
---
apiVersion: v1
kind: Service
metadata:
  name: weknora-app
  namespace: deer-flow
spec:
  selector:
    app: weknora-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: weknora-app-nodeport
  namespace: deer-flow
spec:
  type: NodePort
  selector:
    app: weknora-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 32080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weknora-frontend
  namespace: deer-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weknora-frontend
  template:
    metadata:
      labels:
        app: weknora-frontend
    spec:
      containers:
        - name: frontend
          image: wechatopenai/weknora-ui@sha256:401604e79a5717dd966a13383d775f15d3125481d3e080eba329e4a0fbcf9523
          imagePullPolicy: IfNotPresent
          env:
            - name: MAX_FILE_SIZE_MB
              value: "100"
            - name: APP_HOST
              value: weknora-app
            - name: APP_PORT
              value: "8080"
            - name: APP_SCHEME
              value: http
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: ui-patch
              mountPath: /usr/share/nginx/html/assets/index-itUW58et.js
              subPath: index-itUW58et.js
              readOnly: true
            - name: ui-patch
              mountPath: /usr/share/nginx/html/assets/weknora-BoLwP3xK.png
              subPath: weknora-BoLwP3xK.png
              readOnly: true
            - name: ui-patch
              mountPath: /usr/share/nginx/html/assets/favicon-bEsoBimf.ico
              subPath: favicon-bEsoBimf.ico
              readOnly: true
            - name: ui-patch
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: ui-patch
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
      volumes:
        - name: ui-patch
          configMap:
            name: weknora-ui-patch
---
apiVersion: v1
kind: Service
metadata:
  name: weknora-frontend
  namespace: deer-flow
spec:
  selector:
    app: weknora-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: weknora-frontend-nodeport
  namespace: deer-flow
spec:
  type: NodePort
  selector:
    app: weknora-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 32090
