<script type="module">
try {
  const ssoUrl = globalThis.__RUNTIME_CONFIG__?.DEERFLOW_SSO_URL ||
    `${location.protocol}//${location.hostname}:2026/api/weknora/sso-session`;
  const response = await fetch(ssoUrl, { credentials: 'include', cache: 'no-store' });
  if (response.ok) {
    const data = await response.json();
    const tenant = data && (data.active_tenant || data.tenant);
    if (data?.success && data.token && data.user && tenant) {
      let previousUser = null;
      try { previousUser = JSON.parse(localStorage.getItem('weknora_user') || 'null'); } catch (_) {}
      const userChanged = previousUser?.id && String(previousUser.id) !== String(data.user.id);
      if (userChanged) {
        for (const key of [
          'weknora_selected_tenant_id',
          'weknora_selected_tenant_name',
          'weknora_knowledge_bases',
          'weknora_current_kb',
          'weknora_last_chat_model_id'
        ]) localStorage.removeItem(key);
      }
      localStorage.removeItem('weknora_auto_setup_failed');
      localStorage.setItem('weknora_token', data.token);
      if (data.refresh_token) {
        localStorage.setItem('weknora_refresh_token', data.refresh_token);
      } else {
        localStorage.removeItem('weknora_refresh_token');
      }
      localStorage.setItem('weknora_user', JSON.stringify(data.user));
      localStorage.setItem('weknora_tenant', JSON.stringify(tenant));
      localStorage.setItem('weknora_memberships', JSON.stringify(data.memberships || []));
    }
  }
} catch (error) {
  console.warn('[deerflow-sso-bootstrap] session exchange failed', error);
}
await import('/assets/main-pzt9Cxn1.js');
</script>

<script id="deerflow-brand-text">
(function(){
  var pattern=/WeKnora/gi;
  var name='\u77e5\u8bc6\u5e93';
  var hiddenUserLinks=['Claw Skill','Chrome \u63d2\u4ef6','GitHub'];
  function replace(value){return typeof value==='string'?value.replace(pattern,name):value}
  function brandTitle(){var current=document.title;var next=replace(current)||name;if(next!==current)document.title=next}
  function brand(node){
    if(node.nodeType===Node.TEXT_NODE){var parent=node.parentElement;if(parent&&!parent.closest('script,style,code,pre')){var current=node.nodeValue;var next=replace(current);if(next!==current)node.nodeValue=next;var item=parent.closest('.user-dropdown .menu-item');if(item&&hiddenUserLinks.some(function(label){return (item.textContent||'').indexOf(label)>=0}))item.remove()}return}
    if(!(node instanceof Element))return;
    var item=node.closest('.user-dropdown .menu-item');if(item&&hiddenUserLinks.some(function(label){return (item.textContent||'').indexOf(label)>=0})){item.remove();return}
    ['aria-label','alt','placeholder','title'].forEach(function(attr){if(node.hasAttribute(attr)){var current=node.getAttribute(attr);var next=replace(current);if(next!==current)node.setAttribute(attr,next)}});
    Array.from(node.childNodes).forEach(brand);
  }
  function start(){
    brandTitle();if(document.body)brand(document.body);
    new MutationObserver(function(records){records.forEach(function(record){record.addedNodes.forEach(brand);if(record.type==='characterData')brand(record.target)});brandTitle()}).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
