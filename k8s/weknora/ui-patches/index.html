    <script src="/config.js?v=deerflow-sso-same-origin-1"></script>
    <script type="module">
      const deerflowPolicyKey = "deerflow_weknora_ui_policy";
      const defaultChatModelId = "deerflow-cnooc-deepseek-v4-flash";
      const standardPathPrefixes = [
        "/platform/creatChat",
        "/platform/chat/",
        "/platform/knowledge-bases",
        "/platform/organizations",
        "/platform/agents",
      ];
      const isStandardPath = (pathname) =>
        standardPathPrefixes.some(
          (prefix) =>
            pathname === prefix ||
            pathname.startsWith(prefix.endsWith("/") ? prefix : `${prefix}/`),
        );
      const readDeerFlowPolicy = () => {
        try {
          return JSON.parse(localStorage.getItem(deerflowPolicyKey) || "null");
        } catch (_) {
          return null;
        }
      };
      const enforceDeerFlowPolicyPath = () => {
        const policy = readDeerFlowPolicy();
        if (
          !policy ||
          policy.full_ui !== false ||
          isStandardPath(location.pathname)
        ) {
          return;
        }
        const target = policy.default_path || "/platform/knowledge-bases";
        history.replaceState(history.state, "", target);
        window.dispatchEvent(
          new PopStateEvent("popstate", { state: history.state }),
        );
      };
      const installDeerFlowPolicyNavigationGuard = () => {
        const policy = readDeerFlowPolicy();
        if (!policy || policy.full_ui !== false) return;
        if (!isStandardPath(location.pathname)) {
          history.replaceState(
            history.state,
            "",
            policy.default_path || "/platform/knowledge-bases",
          );
        }
        for (const method of ["pushState", "replaceState"]) {
          const original = history[method].bind(history);
          history[method] = (...args) => {
            original(...args);
            queueMicrotask(enforceDeerFlowPolicyPath);
          };
        }
        window.addEventListener("popstate", () =>
          queueMicrotask(enforceDeerFlowPolicyPath),
        );
        document.addEventListener(
          "click",
          (event) => {
            const anchor =
              event.target instanceof Element
                ? event.target.closest("a[href]")
                : null;
            if (!anchor) return;
            const url = new URL(anchor.href, location.href);
            if (
              url.origin === location.origin &&
              url.pathname.startsWith("/platform/") &&
              !isStandardPath(url.pathname)
            ) {
              event.preventDefault();
              history.pushState(
                {},
                "",
                policy.default_path || "/platform/knowledge-bases",
              );
            }
          },
          true,
        );
      };
      try {
        const ssoUrl =
          globalThis.__RUNTIME_CONFIG__?.DEERFLOW_SSO_URL ||
          "/api/weknora/sso-session";
        const response = await fetch(ssoUrl, {
          credentials: "include",
          cache: "no-store",
        });
        if (response.ok) {
          const data = await response.json();
          const tenant = data && (data.active_tenant || data.tenant);
          if (data?.success && data.token && data.user && tenant) {
            const tenantScopedKeys = [
              "weknora_selected_tenant_id",
              "weknora_selected_tenant_name",
              "weknora_knowledge_bases",
              "weknora_current_kb",
              "weknora_last_chat_model_id",
            ];
            const clearTenantScopedState = () => {
              for (const key of tenantScopedKeys) localStorage.removeItem(key);
            };
            let previousUser = null;
            try {
              previousUser = JSON.parse(
                localStorage.getItem("weknora_user") || "null",
              );
            } catch (_) {}
            const userChanged =
              previousUser?.id &&
              String(previousUser.id) !== String(data.user.id);
            if (userChanged) clearTenantScopedState();
            // A failed native-auth bootstrap can make WeKnora persist its standalone
            // Lite fallback. DeerFlow SSO always targets the full workspace UI, where
            // Lite mode would incorrectly hide organizations/shared spaces.
            localStorage.removeItem("weknora_lite_mode");
            sessionStorage.removeItem("weknora_lite_last_path");
            localStorage.removeItem("weknora_auto_setup_failed");
            localStorage.setItem("weknora_token", data.token);
            if (data.refresh_token) {
              localStorage.setItem("weknora_refresh_token", data.refresh_token);
            } else {
              localStorage.removeItem("weknora_refresh_token");
            }
            localStorage.setItem("weknora_user", JSON.stringify(data.user));
            localStorage.setItem("weknora_tenant", JSON.stringify(tenant));
            localStorage.setItem(
              "weknora_memberships",
              JSON.stringify(data.memberships || []),
            );
            const uiPolicy = data.ui_policy || {
              mode: data.user?.is_system_admin
                ? "system_admin"
                : "personal_workspace_owner",
              full_ui: Boolean(data.user?.is_system_admin),
              default_path: "/platform/knowledge-bases",
            };
            localStorage.setItem(deerflowPolicyKey, JSON.stringify(uiPolicy));
            document.documentElement.setAttribute(
              "data-deerflow-weknora-ui",
              uiPolicy.mode || "personal_workspace_owner",
            );
            if (
              uiPolicy.full_ui === false &&
              !localStorage.getItem("weknora_last_chat_model_id")
            ) {
              localStorage.setItem(
                "weknora_last_chat_model_id",
                defaultChatModelId,
              );
            }

            const selectedTenantId = String(
              localStorage.getItem("weknora_selected_tenant_id") || "",
            ).trim();
            if (selectedTenantId && selectedTenantId !== String(tenant.id)) {
              try {
                const selectedTenantResponse = await fetch(
                  "/api/weknora-native/validate-tenant",
                  {
                    credentials: "include",
                    cache: "no-store",
                    headers: {
                      Authorization: `Bearer ${data.token}`,
                      "X-Tenant-ID": selectedTenantId,
                    },
                  },
                );
                const validationPayload = await selectedTenantResponse
                  .json()
                  .catch(() => null);
                if (
                  selectedTenantResponse.ok &&
                  validationPayload?.valid === false
                ) {
                  clearTenantScopedState();
                }
              } catch (_) {
                // Keep the native selection on transient network errors.
              }
            }
          }
        }
      } catch (error) {
        console.warn("[deerflow-sso-bootstrap] session exchange failed", error);
      }
      installDeerFlowPolicyNavigationGuard();
      await import("/assets/main-BUSZvhEQ.js");
    </script>

    <script id="deerflow-brand-text">
      (function () {
        var pattern = /WeKnora/gi;
        var name = "\u77e5\u8bc6\u5e93";
        var hiddenUserLinks = ["Claw Skill", "Chrome \u63d2\u4ef6", "GitHub"];
        var hiddenStandardLabels = [
          "\u53d1\u5e03\u96c6\u6210",
          "Publish Integrations",
          "Integrations",
        ];
        var allowedStandardSidebarGuides = [
          "nav-creatChat",
          "nav-knowledge-bases",
          "nav-organizations",
          "nav-agents",
        ];
        function isStandardUser() {
          return (
            document.documentElement.getAttribute(
              "data-deerflow-weknora-ui",
            ) === "personal_workspace_owner"
          );
        }
        function hideStandardEntry(item) {
          if (!item) return;
          var text = (item.textContent || "").replace(/\s+/g, " ").trim();
          if (
            hiddenStandardLabels.some(function (label) {
              return text === label || text.indexOf(label) >= 0;
            })
          )
            item.hidden = true;
        }
        var sidebarExpansionApplied = false;
        function expandSidebarOnEntry() {
          if (sidebarExpansionApplied) return;
          localStorage.setItem("sidebar_collapsed", "false");
          var sidebar = document.querySelector(".aside_box");
          if (!sidebar) return;
          if (sidebar.classList.contains("aside_box--collapsed")) {
            var expandButton = sidebar.querySelector(".sidebar-toggle");
            if (!(expandButton instanceof HTMLElement)) return;
            expandButton.click();
          }
          sidebarExpansionApplied = true;
        }
        function hideDisallowedStandardSidebarEntries() {
          if (!isStandardUser()) return;
          document
            .querySelectorAll('.aside_box [data-guide^="nav-"]')
            .forEach(function (item) {
              var guide = item.getAttribute("data-guide") || "";
              if (allowedStandardSidebarGuides.indexOf(guide) >= 0) return;
              var box = item.closest(".menu_box") || item;
              item.setAttribute(
                "data-deerflow-standard-sidebar-hidden",
                "true",
              );
              item.hidden = true;
              box.setAttribute("data-deerflow-standard-sidebar-hidden", "true");
              box.hidden = true;
            });
        }
        function hideStandardSettingsGroup() {
          if (!isStandardUser()) return;
          var hideUntilNextGroup = false;
          document
            .querySelectorAll(
              ".settings-nav .nav-group-title, .settings-nav .nav-item",
            )
            .forEach(function (item) {
              if (item.classList.contains("nav-group-title")) {
                var text = (item.textContent || "").replace(/\s+/g, " ").trim();
                hideUntilNextGroup = hiddenStandardLabels.some(
                  function (label) {
                    return text === label || text.indexOf(label) >= 0;
                  },
                );
              }
              if (hideUntilNextGroup) item.hidden = true;
            });
        }
        function simplifyKnowledgeBaseEditor() {
          if (!isStandardUser()) return;
          document
            .querySelectorAll(".settings-modal")
            .forEach(function (modal) {
              var sidebar = modal.querySelector(
                '[data-guide="kb-editor-sidebar"]',
              );
              if (!sidebar) return;
              var firstPass =
                modal.getAttribute("data-deerflow-kb-editor") !== "simple";
              modal.setAttribute("data-deerflow-kb-editor", "simple");
              var basicItem = sidebar.querySelector(
                '[data-guide="kb-editor-nav-basic"]',
              );
              if (
                firstPass &&
                basicItem instanceof HTMLElement &&
                !basicItem.classList.contains("active")
              ) {
                basicItem.click();
              }
              modal
                .querySelectorAll(
                  '[data-guide="kb-editor-sidebar"] .nav-item:not([data-guide="kb-editor-nav-basic"])',
                )
                .forEach(function (item) {
                  item.hidden = true;
                });
              modal
                .querySelectorAll(
                  '[data-guide="kb-editor-sidebar"] .nav-group-title',
                )
                .forEach(function (item) {
                  item.hidden = true;
                });
            });
        }
        function simplify() {
          expandSidebarOnEntry();
          if (!isStandardUser()) return;
          hideDisallowedStandardSidebarEntries();
          document
            .querySelectorAll(".aside_box .menu_box, .user-dropdown .menu-item")
            .forEach(hideStandardEntry);
          hideStandardSettingsGroup();
          simplifyKnowledgeBaseEditor();
        }
        function replace(value) {
          return typeof value === "string"
            ? value.replace(pattern, name)
            : value;
        }
        function brandTitle() {
          var current = document.title;
          var next = replace(current) || name;
          if (next !== current) document.title = next;
        }
        function brand(node) {
          if (node.nodeType === Node.TEXT_NODE) {
            var parent = node.parentElement;
            if (parent && !parent.closest("script,style,code,pre")) {
              var current = node.nodeValue;
              var next = replace(current);
              if (next !== current) node.nodeValue = next;
              var item = parent.closest(".user-dropdown .menu-item");
              if (
                item &&
                hiddenUserLinks.some(function (label) {
                  return (item.textContent || "").indexOf(label) >= 0;
                })
              )
                item.remove();
            }
            return;
          }
          if (!(node instanceof Element)) return;
          var item = node.closest(".user-dropdown .menu-item");
          if (
            item &&
            hiddenUserLinks.some(function (label) {
              return (item.textContent || "").indexOf(label) >= 0;
            })
          ) {
            item.remove();
            return;
          }
          ["aria-label", "alt", "placeholder", "title"].forEach(
            function (attr) {
              if (node.hasAttribute(attr)) {
                var current = node.getAttribute(attr);
                var next = replace(current);
                if (next !== current) node.setAttribute(attr, next);
              }
            },
          );
          Array.from(node.childNodes).forEach(brand);
        }
        function start() {
          brandTitle();
          if (document.body) brand(document.body);
          simplify();
          new MutationObserver(function (records) {
            records.forEach(function (record) {
              record.addedNodes.forEach(brand);
              if (record.type === "characterData") brand(record.target);
            });
            brandTitle();
            simplify();
          }).observe(document.documentElement, {
            childList: true,
            subtree: true,
            characterData: true,
          });
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", start, { once: true });
        else start();
      })();
    </script>
