apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deer-flow

resources:
  - weknora.yaml

configMapGenerator:
  - name: weknora-config
    files:
      - config.yaml
      - builtin_models.yaml
  - name: weknora-ui-patch
    files:
      - index-DeX5ZUuT.js=ui-patches/index-DeX5ZUuT.js
      - Login-JaWLYwhw.js=ui-patches/Login-JaWLYwhw.js
      - weknora-BoLwP3xK.png=ui-patches/weknora-BoLwP3xK.png
      - favicon-bEsoBimf.ico=ui-patches/favicon-bEsoBimf.ico
      - index.html=ui-patches/index.html
      - config.js=ui-patches/config.js
      - default.conf=ui-patches/default-ascii.conf

generatorOptions:
  disableNameSuffixHash: true
