apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deer-flow

resources:
  - weknora.yaml
  - enterprise-model-feature-defaults-job.yaml

configMapGenerator:
  - name: weknora-config
    files:
      - config.yaml
      - builtin_agents.yaml
      - builtin_models.yaml
  - name: weknora-ui-patch
    files:
      - index-itUW58et.js=ui-patches/index-itUW58et.js
      - weknora-BoLwP3xK.png=ui-patches/weknora-BoLwP3xK.png
      - favicon-bEsoBimf.ico=ui-patches/favicon-bEsoBimf.ico
      - index.html=ui-patches/index.html
      - config.js=ui-patches/config.js
      - default.conf=ui-patches/default.conf
  - name: weknora-enterprise-model-defaults
    files:
      - defaults.sql=enterprise-model-feature-defaults.sql
  - name: weknora-docreader-xlsx-compat
    files:
      - sitecustomize.py=docreader-compat/sitecustomize.py
      - web_compat.py=docreader-compat/web_compat.py
      - xlsx_compat.py=docreader-compat/xlsx_compat.py

generatorOptions:
  disableNameSuffixHash: true
