# DeerFlow phase-1 integration values for the upstream iFLYTEK SkillHub chart.
#
# Use this as a non-secret base file. Keep production passwords and identity
# provider credentials in a separate protected values file or Secret manager.

fullnameOverride: skillhub

global:
  # The offline release deliberately mirrors Bitnami images to deerflow.local.
  security:
    allowInsecureImages: true

images:
  # Production is an offline ARM64 cluster. Mirror the reviewed images under
  # these local names before installing the chart.
  registry: deerflow.local
  tag: REPLACE_WITH_DEERFLOW_SKILLHUB_RELEASE_TAG
  # Enterprise nodes use pre-imported, immutable images.
  pullPolicy: Never

# Replace the host with DeerFlow's real public HTTPS origin. The path must stay
# aligned with web.basePath, web.apiBaseUrl, and the DeerFlow Nginx location.
publicBaseUrl: https://deerflow.example.com/platform/skillhub

ingress:
  enabled: false

web:
  basePath: /platform/skillhub/
  apiBaseUrl: /platform/skillhub
  service:
    enabled: true
    type: ClusterIP
    port: 80
  extraEnv:
    - name: SKILLHUB_TRUST_FORWARDED_PROTO
      value: "true"
    - name: SKILLHUB_WEB_AUTH_SESSION_BOOTSTRAP_ENABLED
      value: "true"
    - name: SKILLHUB_WEB_AUTH_SESSION_BOOTSTRAP_PROVIDER
      value: deerflow-session
    - name: SKILLHUB_WEB_AUTH_SESSION_BOOTSTRAP_AUTO
      value: "true"

server:
  # Build the reviewed v0.2.18 source with k8s/skillhub/server-overlay and
  # import this immutable image on every eligible node before rollout.
  image:
    registry: deerflow.local
    tag: REPLACE_WITH_DEERFLOW_SKILLHUB_SERVER_TAG
  dependencyWait:
    image:
      registry: deerflow.local
      repository: skillhub-busybox
      tag: REPLACE_WITH_DEERFLOW_SKILLHUB_RELEASE_TAG
      pullPolicy: Never
  service:
    enabled: true
    type: ClusterIP
    port: 8080
  storage:
    accessMode: ReadWriteOnce
    size: 10Gi
  # Phase 1 treats ordinary DeerFlow users as skill consumers. Native
  # namespace membership can still grant selected publishers access later.
  extraEnv:
    - name: SKILLHUB_NAMESPACE_PERSONAL_PROVISIONING_ENABLED
      value: "false"
    - name: SKILLHUB_AUTH_SESSION_BOOTSTRAP_ENABLED
      value: "true"
    - name: SKILLHUB_AUTH_DEERFLOW_SESSION_ENABLED
      value: "true"
    - name: SKILLHUB_AUTH_DEERFLOW_SESSION_SECRET
      valueFrom:
        secretKeyRef:
          name: deer-flow-env
          key: SKILLHUB_SESSION_BRIDGE_SECRET
# Phase 1 uses SkillHub's native local administrator. Replace every placeholder
# in a protected override file before install, then rotate or disable this
# account after enterprise OIDC is confirmed.
auth:
  direct:
    enabled: true
    provider: local

bootstrapAdmin:
  enabled: true
  userId: deerflow-skillhub-admin
  username: admin
  displayName: SkillHub Administrator
  email: skillhub-admin@example.com

secrets:
  allowAutoGenerated: false
  bootstrapAdminPassword: REPLACE_WITH_A_STRONG_ADMIN_PASSWORD
  downloadAnonCookieSecret: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS

session:
  cookieSecure: true

postgresql:
  enabled: true
  image:
    registry: deerflow.local
    repository: skillhub-postgresql
    tag: REPLACE_WITH_DEERFLOW_SKILLHUB_RELEASE_TAG
    digest: ""
    pullPolicy: Never
  auth:
    postgresPassword: REPLACE_WITH_A_STRONG_POSTGRES_ADMIN_PASSWORD
    database: skillhub
    username: skillhub
    password: REPLACE_WITH_A_STRONG_SKILLHUB_DATABASE_PASSWORD
  primary:
    persistence:
      enabled: true
      size: 10Gi
  metrics:
    enabled: true
    image:
      registry: deerflow.local
      repository: skillhub-postgres-exporter
      tag: REPLACE_WITH_DEERFLOW_SKILLHUB_RELEASE_TAG
      digest: ""
      pullPolicy: Never

redis:
  enabled: true
  image:
    registry: deerflow.local
    repository: skillhub-redis
    tag: REPLACE_WITH_DEERFLOW_SKILLHUB_RELEASE_TAG
    digest: ""
    pullPolicy: Never
  auth:
    enabled: true
    password: REPLACE_WITH_A_STRONG_REDIS_PASSWORD
  master:
    persistence:
      enabled: true
      size: 5Gi
  metrics:
    enabled: true
    image:
      registry: deerflow.local
      repository: skillhub-redis-exporter
      tag: REPLACE_WITH_DEERFLOW_SKILLHUB_RELEASE_TAG
      digest: ""
      pullPolicy: Never

scanner:
  enabled: true
