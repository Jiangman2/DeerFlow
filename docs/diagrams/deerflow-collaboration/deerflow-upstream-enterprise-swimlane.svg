<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475467"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f75b5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27864b"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #667085; }
      .laneTitle { font-size: 20px; font-weight: 700; fill: #17365d; }
      .laneSub { font-size: 14px; fill: #667085; }
      .boxTitle { font-size: 19px; font-weight: 700; }
      .boxSub { font-size: 15px; fill: #52606d; }
      .cmd { font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; fill: #243447; }
      .small { font-size: 13px; fill: #667085; }
      .label { font-size: 14px; fill: #475467; }
      .num { font-size: 18px; font-weight: 700; fill: white; }
      .rule { font-size: 15px; fill: #344054; }
    </style>
  </defs>

  <rect width="2200" height="1700" fill="#ffffff"/>
  <rect x="30" y="26" width="2140" height="1648" rx="22" fill="none" stroke="#d0d5dd" stroke-width="2"/>

  <text x="1100" y="76" text-anchor="middle" class="font title">DeerFlow 官方同步与企业协同开发泳道图</text>
  <text x="1100" y="110" text-anchor="middle" class="font subtitle">按角色说明代码从 GitHub 官方仓库流向企业集成分支，再通过 Feature 分支和 Pull Request 协同开发</text>

  <!-- Legend -->
  <rect x="85" y="135" width="2030" height="62" rx="12" fill="#f8fafc" stroke="#d0d5dd"/>
  <text x="115" y="173" class="font boxTitle">分支约定：</text>
  <rect x="270" y="153" width="18" height="18" rx="4" fill="#d9ead3" stroke="#70ad47"/><text x="300" y="169" class="font small">官方分支</text>
  <rect x="425" y="153" width="18" height="18" rx="4" fill="#fff2cc" stroke="#d6b656"/><text x="455" y="169" class="font small">官方镜像 / 同步指针</text>
  <rect x="675" y="153" width="18" height="18" rx="4" fill="#fce4d6" stroke="#ed7d31"/><text x="705" y="169" class="font small">企业集成分支</text>
  <rect x="895" y="153" width="18" height="18" rx="4" fill="#eaf2f8" stroke="#5b9bd5"/><text x="925" y="169" class="font small">Feature 分支</text>
  <text x="1170" y="169" class="font small">origin = 公司仓库 / 个人 Fork</text>
  <text x="1465" y="169" class="font small">upstream = DeerFlow 官方仓库，只读</text>

  <!-- Swimlane frame -->
  <rect x="85" y="220" width="2030" height="1210" rx="14" fill="#ffffff" stroke="#98a2b3" stroke-width="2"/>
  <rect x="85" y="220" width="245" height="1210" fill="#f2f4f7"/>
  <line x1="330" y1="220" x2="330" y2="1430" stroke="#98a2b3" stroke-width="2"/>

  <!-- Lane backgrounds -->
  <rect x="330" y="220" width="1785" height="242" fill="#f5fbf1"/>
  <rect x="330" y="462" width="1785" height="240" fill="#fffaf0"/>
  <rect x="330" y="702" width="1785" height="292" fill="#f5f9fe"/>
  <rect x="330" y="994" width="1785" height="242" fill="#f3fbf5"/>
  <rect x="330" y="1236" width="1785" height="194" fill="#f8f5ff"/>

  <!-- Horizontal lane separators -->
  <line x1="85" y1="462" x2="2115" y2="462" stroke="#98a2b3" stroke-width="2"/>
  <line x1="85" y1="702" x2="2115" y2="702" stroke="#98a2b3" stroke-width="2"/>
  <line x1="85" y1="994" x2="2115" y2="994" stroke="#98a2b3" stroke-width="2"/>
  <line x1="85" y1="1236" x2="2115" y2="1236" stroke="#98a2b3" stroke-width="2"/>

  <!-- Lane labels -->
  <text x="207" y="285" text-anchor="middle" class="font laneTitle">官方维护者</text>
  <text x="207" y="317" text-anchor="middle" class="font laneSub">DeerFlow 官方仓库</text>
  <text x="207" y="342" text-anchor="middle" class="font laneSub">维护 upstream/main</text>

  <text x="207" y="528" text-anchor="middle" class="font laneTitle">同步维护者</text>
  <text x="207" y="560" text-anchor="middle" class="font laneSub">企业代码维护人</text>
  <text x="207" y="585" text-anchor="middle" class="font laneSub">维护官方镜像和集成基线</text>

  <text x="207" y="790" text-anchor="middle" class="font laneTitle">企业开发者</text>
  <text x="207" y="822" text-anchor="middle" class="font laneSub">从集成分支创建 Feature</text>
  <text x="207" y="847" text-anchor="middle" class="font laneSub">本地开发、测试、推送 PR</text>

  <text x="207" y="1078" text-anchor="middle" class="font laneTitle">Review / 集成维护者</text>
  <text x="207" y="1110" text-anchor="middle" class="font laneSub">代码审查、CI、合并</text>
  <text x="207" y="1135" text-anchor="middle" class="font laneSub">保护 enterprise/integration</text>

  <text x="207" y="1300" text-anchor="middle" class="font laneTitle">发布 / 运维</text>
  <text x="207" y="1332" text-anchor="middle" class="font laneSub">集成验证、发布、回归</text>
  <text x="207" y="1357" text-anchor="middle" class="font laneSub">进入下一轮官方同步</text>

  <!-- Official lane steps -->
  <circle cx="380" cy="255" r="22" fill="#70ad47"/><text x="380" y="262" text-anchor="middle" class="font num">1</text>
  <rect x="415" y="238" width="395" height="185" rx="12" fill="#e2f0d9" stroke="#70ad47" stroke-width="2"/>
  <text x="438" y="274" class="font boxTitle">官方发布更新</text>
  <text x="438" y="305" class="font boxSub">GitHub：bytedance/deer-flow</text>
  <text x="438" y="335" class="font boxSub">分支：upstream/main</text>
  <text x="438" y="373" class="font small">官方修复、功能、依赖、安全更新</text>
  <text x="438" y="398" class="font small">企业仓库不直接向此分支提交代码</text>

  <rect x="860" y="282" width="440" height="100" rx="12" fill="#ffffff" stroke="#70ad47" stroke-dasharray="7 5" stroke-width="2"/>
  <text x="1080" y="317" text-anchor="middle" class="font boxTitle">官方更新进入 upstream/main</text>
  <text x="1080" y="350" text-anchor="middle" class="font boxSub">企业侧通过 fetch 获取，不直接改写官方历史</text>
  <path d="M810 330 L860 330" stroke="#70ad47" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Sync maintainer lane -->
  <circle cx="380" cy="505" r="22" fill="#d6b656"/><text x="380" y="512" text-anchor="middle" class="font num">2</text>
  <rect x="415" y="482" width="430" height="190" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="438" y="518" class="font boxTitle">同步官方代码镜像</text>
  <text x="438" y="549" class="font boxSub">分支：vendor/upstream-main</text>
  <text x="438" y="584" class="font cmd">git fetch upstream --prune</text>
  <text x="438" y="608" class="font cmd">git merge --ff-only upstream/main</text>
  <text x="438" y="632" class="font cmd">git push origin vendor/upstream-main</text>
  <text x="438" y="657" class="font small">只同步官方，不在此分支开发业务功能</text>

  <circle cx="925" cy="505" r="22" fill="#2f75b5"/><text x="925" y="512" text-anchor="middle" class="font num">3</text>
  <rect x="960" y="482" width="420" height="190" rx="12" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="2"/>
  <text x="983" y="518" class="font boxTitle">更新官方同步基线</text>
  <text x="983" y="549" class="font boxSub">merge base / enterprise integration base</text>
  <text x="983" y="584" class="font cmd">git switch enterprise/integration</text>
  <text x="983" y="608" class="font cmd">git merge --no-ff vendor/upstream-main</text>
  <text x="983" y="632" class="font cmd">make test &amp;&amp; pnpm check</text>
  <text x="983" y="657" class="font small">实际分支：codex/enterprise-consolidation-20260716</text>
  <path d="M845 577 L960 577" stroke="#2f75b5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="858" y="563" class="font label">同步后合并</text>

  <rect x="1480" y="510" width="500" height="108" rx="12" fill="#fce4d6" stroke="#ed7d31" stroke-width="2"/>
  <text x="1730" y="547" text-anchor="middle" class="font boxTitle">企业集成分支</text>
  <text x="1730" y="577" text-anchor="middle" class="font boxSub">官方基线 + 企业功能 + 集成测试</text>
  <text x="1730" y="602" text-anchor="middle" class="font small">enterprise/integration · 保护分支</text>
  <path d="M1380 577 L1480 577" stroke="#ed7d31" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Developer lane -->
  <circle cx="380" cy="745" r="22" fill="#5b9bd5"/><text x="380" y="752" text-anchor="middle" class="font num">4</text>
  <rect x="415" y="722" width="410" height="228" rx="12" fill="#eaf2f8" stroke="#5b9bd5" stroke-width="2"/>
  <text x="438" y="758" class="font boxTitle">创建 Feature 分支</text>
  <text x="438" y="793" class="font cmd">git switch enterprise/integration</text>
  <text x="438" y="817" class="font cmd">git pull --ff-only</text>
  <text x="438" y="841" class="font cmd">git switch -c feature/&lt;name&gt;</text>
  <text x="438" y="883" class="font small">一个分支只做一类功能</text>
  <text x="438" y="907" class="font small">不要从旧 main 或 upstream/main 创建</text>
  <text x="438" y="931" class="font small">示例：feature/sso、feature/weknora、feature/k8s</text>

  <circle cx="930" cy="745" r="22" fill="#5b9bd5"/><text x="930" y="752" text-anchor="middle" class="font num">5</text>
  <rect x="965" y="722" width="410" height="228" rx="12" fill="#eaf2f8" stroke="#5b9bd5" stroke-width="2"/>
  <text x="988" y="758" class="font boxTitle">本地开发与提交</text>
  <text x="988" y="793" class="font cmd">make test / pnpm check</text>
  <text x="988" y="817" class="font cmd">git add .</text>
  <text x="988" y="841" class="font cmd">git commit -m "feat: ..."</text>
  <text x="988" y="883" class="font small">确认测试通过、无敏感配置、无无关改动</text>
  <text x="988" y="907" class="font small">提交信息写明业务目的和影响范围</text>

  <circle cx="1480" cy="745" r="22" fill="#5b9bd5"/><text x="1480" y="752" text-anchor="middle" class="font num">6</text>
  <rect x="1515" y="722" width="470" height="228" rx="12" fill="#eaf2f8" stroke="#5b9bd5" stroke-width="2"/>
  <text x="1538" y="758" class="font boxTitle">Push 并创建 Pull Request</text>
  <text x="1538" y="793" class="font cmd">git push -u origin feature/&lt;name&gt;</text>
  <text x="1538" y="835" class="font small">GitHub PR：</text>
  <text x="1538" y="861" class="font small">源：feature/&lt;name&gt;</text>
  <text x="1538" y="885" class="font small">目标：enterprise/integration</text>
  <text x="1538" y="923" class="font small">⚠ 不提交到 upstream/main 或旧 main</text>
  <path d="M825 836 L965 836" stroke="#5b9bd5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M1375 836 L1515 836" stroke="#5b9bd5" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- Review lane -->
  <circle cx="380" cy="1037" r="22" fill="#70ad47"/><text x="380" y="1044" text-anchor="middle" class="font num">7</text>
  <rect x="415" y="1014" width="420" height="192" rx="12" fill="#eef8f0" stroke="#70ad47" stroke-width="2"/>
  <text x="438" y="1050" class="font boxTitle">代码 Review 与 CI</text>
  <text x="438" y="1085" class="font small">1. 维护者审查代码和设计</text>
  <text x="438" y="1112" class="font small">2. 自动化测试、构建、安全检查</text>
  <text x="438" y="1139" class="font small">3. 开发者根据意见修改并继续 Push</text>
  <text x="438" y="1173" class="font small">通过后进入合并流程</text>

  <circle cx="955" cy="1037" r="22" fill="#70ad47"/><text x="955" y="1044" text-anchor="middle" class="font num">8</text>
  <rect x="990" y="1014" width="430" height="192" rx="12" fill="#eef8f0" stroke="#70ad47" stroke-width="2"/>
  <text x="1013" y="1050" class="font boxTitle">Squash Merge 到集成分支</text>
  <text x="1013" y="1085" class="font small">PR 审查通过后合并到</text>
  <text x="1013" y="1112" class="font boxSub">enterprise/integration</text>
  <text x="1013" y="1147" class="font small">保持提交历史清晰，便于回滚和追踪</text>
  <text x="1013" y="1174" class="font small">集成分支禁止直接 Push</text>

  <rect x="1515" y="1050" width="470" height="108" rx="12" fill="#fce4d6" stroke="#ed7d31" stroke-width="2"/>
  <text x="1750" y="1086" text-anchor="middle" class="font boxTitle">Feature 生命周期结束</text>
  <text x="1750" y="1118" text-anchor="middle" class="font boxSub">完成合并后删除远程和本地 Feature 分支</text>
  <path d="M1985 836 C2030 836 2030 1075 1985 1075" fill="none" stroke="#70ad47" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M835 1110 L990 1110" stroke="#70ad47" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Release lane -->
  <circle cx="380" cy="1275" r="22" fill="#8064a2"/><text x="380" y="1282" text-anchor="middle" class="font num">9</text>
  <rect x="415" y="1253" width="430" height="145" rx="12" fill="#f8f5ff" stroke="#8064a2" stroke-width="2"/>
  <text x="438" y="1289" class="font boxTitle">集成验证与发布</text>
  <text x="438" y="1323" class="font cmd">git switch enterprise/integration</text>
  <text x="438" y="1347" class="font cmd">git pull --ff-only origin ...</text>
  <text x="438" y="1377" class="font small">发布测试版 / 生产版，完成回归验证</text>

  <rect x="990" y="1253" width="430" height="145" rx="12" fill="#f8f5ff" stroke="#8064a2" stroke-width="2"/>
  <text x="1013" y="1289" class="font boxTitle">下一轮官方同步</text>
  <text x="1013" y="1323" class="font small">官方更新 → vendor/upstream-main</text>
  <text x="1013" y="1349" class="font small">→ enterprise/integration → Feature</text>
  <text x="1013" y="1377" class="font small">形成持续可维护的循环</text>

  <rect x="1515" y="1253" width="470" height="145" rx="12" fill="#fffaf0" stroke="#d6b656" stroke-width="2"/>
  <text x="1750" y="1289" text-anchor="middle" class="font boxTitle">分支保护策略</text>
  <text x="1750" y="1323" text-anchor="middle" class="font small">至少 1 名 Review · CI 必须通过</text>
  <text x="1750" y="1349" text-anchor="middle" class="font small">禁止直接 Push · 所有变更走 PR</text>
  <text x="1750" y="1377" text-anchor="middle" class="font small">upstream/main 仅作上游来源</text>

  <path d="M1420 1110 L1515 1110" stroke="#8064a2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M845 1325 L990 1325" stroke="#8064a2" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Historical main warning -->
  <rect x="85" y="1460" width="2030" height="90" rx="12" fill="#fce4d6" stroke="#c0504d" stroke-width="2"/>
  <text x="115" y="1497" class="font boxTitle" fill="#9c0006">旧 main：历史产品分支，不作为新 Feature 基线</text>
  <text x="115" y="1529" class="font rule">原因：已叠加大量历史企业定制，与官方代码分层不清；继续从它创建分支，会让官方同步、冲突处理和责任边界越来越复杂。</text>

  <text x="1100" y="1608" text-anchor="middle" class="font subtitle">最终目标：官方维护者负责上游，企业同步维护者负责基线，开发者负责 Feature，集成维护者负责 PR，发布人员负责验证和交付</text>
</svg>
