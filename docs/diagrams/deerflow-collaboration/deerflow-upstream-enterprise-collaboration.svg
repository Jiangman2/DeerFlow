<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44546a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f75b5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27864b"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 34px; font-weight: 700; }
      .section { font-size: 23px; font-weight: 700; fill: #17365d; }
      .box-title { font-size: 22px; font-weight: 700; }
      .box-sub { font-size: 17px; fill: #52606d; }
      .label { font-size: 16px; fill: #52606d; }
      .small { font-size: 14px; fill: #667085; }
      .cmd { font-family: "Cascadia Code", Consolas, monospace; font-size: 14px; fill: #243447; }
      .num { font-size: 21px; font-weight: 700; fill: white; }
      .note { font-size: 15px; fill: #344054; }
    </style>
  </defs>

  <rect width="2200" height="1700" fill="#ffffff"/>
  <rect x="34" y="28" width="2132" height="1640" rx="22" fill="none" stroke="#d0d5dd" stroke-width="2"/>

  <text x="1100" y="78" text-anchor="middle" class="font title">DeerFlow 官方同步与企业协同开发地图</text>
  <text x="1100" y="112" text-anchor="middle" class="font box-sub">官方代码单向同步，企业功能在集成分支叠加，Feature 分支通过 Pull Request 回流</text>

  <!-- Top architecture map -->
  <rect x="60" y="145" width="2080" height="590" rx="16" fill="#f8fafc" stroke="#b7c9dc" stroke-width="2"/>
  <text x="90" y="188" class="font section">一、分支拓扑：官方代码与企业代码分层</text>

  <!-- Official source -->
  <rect x="95" y="245" width="395" height="112" rx="14" fill="#e2f0d9" stroke="#70ad47" stroke-width="2"/>
  <text x="292" y="282" text-anchor="middle" class="font box-title">GitHub 官方仓库</text>
  <text x="292" y="316" text-anchor="middle" class="font box-sub">bytedance/deer-flow</text>
  <text x="292" y="341" text-anchor="middle" class="font small">官方唯一源头 · 不直接提交企业代码</text>

  <rect x="95" y="405" width="395" height="112" rx="14" fill="#d9ead3" stroke="#70ad47" stroke-width="2"/>
  <text x="292" y="442" text-anchor="middle" class="font box-title">upstream/main</text>
  <text x="292" y="475" text-anchor="middle" class="font box-sub">官方主线</text>
  <text x="292" y="500" text-anchor="middle" class="font small">只读跟踪 · 官方更新入口</text>
  <path d="M292 357 L292 405" stroke="#70ad47" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Local mirror -->
  <rect x="590" y="245" width="430" height="112" rx="14" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="805" y="282" text-anchor="middle" class="font box-title">vendor/upstream-main</text>
  <text x="805" y="316" text-anchor="middle" class="font box-sub">本地官方代码镜像 / 同步指针</text>
  <text x="805" y="341" text-anchor="middle" class="font small">只同步官方 · 不承载企业 Feature</text>
  <path d="M490 461 C540 461 540 301 590 301" fill="none" stroke="#70ad47" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="510" y="377" class="font label">fetch / fast-forward</text>

  <!-- Merge base -->
  <rect x="590" y="405" width="430" height="112" rx="14" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="2"/>
  <text x="805" y="442" text-anchor="middle" class="font box-title">官方同步基线</text>
  <text x="805" y="475" text-anchor="middle" class="font box-sub">merge base / integration base</text>
  <text x="805" y="500" text-anchor="middle" class="font small">将官方更新变成企业可集成的基线</text>
  <path d="M805 357 L805 405" stroke="#2f75b5" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- Enterprise integration -->
  <rect x="1120" y="305" width="495" height="155" rx="14" fill="#fce4d6" stroke="#ed7d31" stroke-width="2.5"/>
  <text x="1367" y="345" text-anchor="middle" class="font box-title">企业集成分支</text>
  <text x="1367" y="379" text-anchor="middle" class="font box-sub">enterprise/integration</text>
  <text x="1367" y="407" text-anchor="middle" class="font small">实际分支：codex/enterprise-consolidation-20260716</text>
  <text x="1367" y="435" text-anchor="middle" class="font note">官方基线 + 已验证企业功能 + 集成测试</text>
  <path d="M1020 461 C1060 461 1060 383 1120 383" fill="none" stroke="#2f75b5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="1033" y="425" class="font label">merge 官方基线</text>

  <!-- Feature branches -->
  <rect x="1710" y="210" width="360" height="92" rx="12" fill="#eaf2f8" stroke="#5b9bd5" stroke-width="2"/>
  <text x="1890" y="246" text-anchor="middle" class="font box-title">feature/sso</text>
  <text x="1890" y="276" text-anchor="middle" class="font box-sub">SSO / 认证</text>
  <rect x="1710" y="325" width="360" height="92" rx="12" fill="#eaf2f8" stroke="#5b9bd5" stroke-width="2"/>
  <text x="1890" y="361" text-anchor="middle" class="font box-title">feature/weknora</text>
  <text x="1890" y="391" text-anchor="middle" class="font box-sub">WeKnora 集成</text>
  <rect x="1710" y="440" width="360" height="92" rx="12" fill="#eaf2f8" stroke="#5b9bd5" stroke-width="2"/>
  <text x="1890" y="476" text-anchor="middle" class="font box-title">feature/k8s</text>
  <text x="1890" y="506" text-anchor="middle" class="font box-sub">Kubernetes / Nginx</text>
  <rect x="1710" y="555" width="360" height="92" rx="12" fill="#eaf2f8" stroke="#5b9bd5" stroke-width="2"/>
  <text x="1890" y="591" text-anchor="middle" class="font box-title">feature/&lt;业务功能&gt;</text>
  <text x="1890" y="621" text-anchor="middle" class="font box-sub">一个分支只做一类事情</text>

  <path d="M1615 340 C1655 300 1660 256 1710 256" fill="none" stroke="#5b9bd5" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowBlue)"/>
  <path d="M1615 370 L1710 371" stroke="#5b9bd5" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowBlue)"/>
  <path d="M1615 400 C1655 440 1660 486 1710 486" fill="none" stroke="#5b9bd5" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowBlue)"/>
  <path d="M1615 430 C1650 530 1660 601 1710 601" fill="none" stroke="#5b9bd5" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowBlue)"/>
  <text x="1626" y="270" class="font label">从集成分支创建</text>
  <path d="M1710 289 C1655 340 1655 360 1615 360" fill="none" stroke="#27864b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M1710 404 C1650 420 1650 390 1615 390" fill="none" stroke="#27864b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M1710 519 C1650 500 1650 420 1615 420" fill="none" stroke="#27864b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M1710 634 C1650 560 1650 450 1615 450" fill="none" stroke="#27864b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="1630" y="660" class="font label">PR 审查后合并回集成分支</text>

  <!-- Old main warning -->
  <rect x="95" y="575" width="925" height="100" rx="12" fill="#fce4d6" stroke="#c0504d" stroke-width="2"/>
  <text x="125" y="613" class="font box-title" fill="#9c0006">旧 main：历史企业产品分支</text>
  <text x="125" y="646" class="font box-sub">已有大量历史定制，与官方主线存在较大偏差；保留作迁移参考，不作为新 Feature 的创建基线</text>
  <text x="125" y="668" class="font small" fill="#9c0006">⚠ 不能把“历史产品分支”当成“官方同步基线”</text>

  <!-- Bottom operation flow -->
  <rect x="60" y="765" width="2080" height="825" rx="16" fill="#fbfcfe" stroke="#b7c9dc" stroke-width="2"/>
  <text x="90" y="808" class="font section">二、未来协同开发：从 GitHub 拉取代码到提交 PR 的标准操作</text>

  <!-- Step card helper style by repeated shapes -->
  <!-- Row 1 -->
  <rect x="90" y="850" width="490" height="270" rx="14" fill="#ffffff" stroke="#98a2b3" stroke-width="2"/>
  <circle cx="125" cy="890" r="24" fill="#2f75b5"/><text x="125" y="897" text-anchor="middle" class="font num">1</text>
  <text x="165" y="898" class="font box-title">克隆代码，配置远程仓库</text>
  <text x="115" y="938" class="font cmd">git clone &lt;team-repo&gt;</text>
  <text x="115" y="963" class="font cmd">cd deer-flow</text>
  <text x="115" y="988" class="font cmd">git remote add upstream</text>
  <text x="115" y="1013" class="font cmd">https://github.com/bytedance/deer-flow.git</text>
  <text x="115" y="1054" class="font small">origin = 公司仓库/个人 Fork</text>
  <text x="115" y="1078" class="font small">upstream = DeerFlow 官方仓库，只读</text>

  <rect x="630" y="850" width="490" height="270" rx="14" fill="#ffffff" stroke="#98a2b3" stroke-width="2"/>
  <circle cx="665" cy="890" r="24" fill="#70ad47"/><text x="665" y="897" text-anchor="middle" class="font num">2</text>
  <text x="705" y="898" class="font box-title">同步官方代码</text>
  <text x="655" y="938" class="font cmd">git fetch upstream --prune</text>
  <text x="655" y="963" class="font cmd">git switch vendor/upstream-main</text>
  <text x="655" y="988" class="font cmd">git merge --ff-only upstream/main</text>
  <text x="655" y="1013" class="font cmd">git push origin vendor/upstream-main</text>
  <text x="655" y="1054" class="font small">只做官方同步，不在此分支写业务代码</text>
  <text x="655" y="1078" class="font small">同步失败先处理版本差异，不直接覆盖企业代码</text>

  <rect x="1170" y="850" width="490" height="270" rx="14" fill="#fffaf0" stroke="#d6b656" stroke-width="2"/>
  <circle cx="1205" cy="890" r="24" fill="#d6b656"/><text x="1205" y="897" text-anchor="middle" class="font num">3</text>
  <text x="1245" y="898" class="font box-title">更新企业集成基线</text>
  <text x="1195" y="938" class="font cmd">git switch enterprise/integration</text>
  <text x="1195" y="963" class="font cmd">git merge --no-ff vendor/upstream-main</text>
  <text x="1195" y="988" class="font cmd">make test</text>
  <text x="1195" y="1013" class="font cmd">pnpm check</text>
  <text x="1195" y="1054" class="font small">完成官方更新与企业功能的集成验证</text>
  <text x="1195" y="1078" class="font small">实际集成分支：codex/enterprise-consolidation-20260716</text>

  <rect x="1710" y="850" width="390" height="270" rx="14" fill="#ffffff" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="1745" cy="890" r="24" fill="#5b9bd5"/><text x="1745" y="897" text-anchor="middle" class="font num">4</text>
  <text x="1785" y="898" class="font box-title">创建 Feature 分支</text>
  <text x="1735" y="938" class="font cmd">git switch enterprise/integration</text>
  <text x="1735" y="963" class="font cmd">git pull --ff-only</text>
  <text x="1735" y="988" class="font cmd">git switch -c feature/&lt;name&gt;</text>
  <text x="1735" y="1034" class="font small">每个 Feature 分支只做一类功能</text>
  <text x="1735" y="1058" class="font small">不要从旧 main 或 upstream/main 创建</text>

  <path d="M580 985 L630 985" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1120 985 L1170 985" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1660 985 L1710 985" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect x="90" y="1170" width="490" height="270" rx="14" fill="#ffffff" stroke="#98a2b3" stroke-width="2"/>
  <circle cx="125" cy="1210" r="24" fill="#5b9bd5"/><text x="125" y="1217" text-anchor="middle" class="font num">5</text>
  <text x="165" y="1218" class="font box-title">本地开发、测试、提交</text>
  <text x="115" y="1258" class="font cmd">git status</text>
  <text x="115" y="1283" class="font cmd">make test / pnpm check</text>
  <text x="115" y="1308" class="font cmd">git add .</text>
  <text x="115" y="1333" class="font cmd">git commit -m "feat: ..."</text>
  <text x="115" y="1374" class="font small">提交前确认：测试通过、无敏感配置、无无关改动</text>
  <text x="115" y="1398" class="font small">提交信息描述清楚业务目的和影响范围</text>

  <rect x="630" y="1170" width="490" height="270" rx="14" fill="#ffffff" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="665" cy="1210" r="24" fill="#5b9bd5"/><text x="665" y="1217" text-anchor="middle" class="font num">6</text>
  <text x="705" y="1218" class="font box-title">推送远程 Feature 分支</text>
  <text x="655" y="1258" class="font cmd">git push -u origin feature/&lt;name&gt;</text>
  <text x="655" y="1304" class="font small">GitHub 上创建 Pull Request</text>
  <text x="655" y="1330" class="font small">源分支：feature/&lt;name&gt;</text>
  <text x="655" y="1355" class="font small">目标分支：enterprise/integration</text>
  <text x="655" y="1398" class="font small">⚠ 企业 PR 不提交到 upstream/main</text>

  <rect x="1170" y="1170" width="490" height="270" rx="14" fill="#eef8f0" stroke="#70ad47" stroke-width="2"/>
  <circle cx="1205" cy="1210" r="24" fill="#70ad47"/><text x="1205" y="1217" text-anchor="middle" class="font num">7</text>
  <text x="1245" y="1218" class="font box-title">Review、CI、合并</text>
  <text x="1195" y="1258" class="font small">1. 代码 Review</text>
  <text x="1195" y="1285" class="font small">2. 自动化测试 / 构建 / 安全检查</text>
  <text x="1195" y="1312" class="font small">3. 根据意见修改并继续 Push</text>
  <text x="1195" y="1339" class="font small">4. 审核通过后 Squash Merge</text>
  <text x="1195" y="1398" class="font small">合并结果进入企业集成分支</text>

  <rect x="1710" y="1170" width="390" height="270" rx="14" fill="#f8f5ff" stroke="#8064a2" stroke-width="2"/>
  <circle cx="1745" cy="1210" r="24" fill="#8064a2"/><text x="1745" y="1217" text-anchor="middle" class="font num">8</text>
  <text x="1785" y="1218" class="font box-title">同步、发布、循环</text>
  <text x="1735" y="1258" class="font cmd">git switch enterprise/integration</text>
  <text x="1735" y="1283" class="font cmd">git pull --ff-only origin ...</text>
  <text x="1735" y="1327" class="font small">集成验证后发布测试版 / 生产版</text>
  <text x="1735" y="1354" class="font small">下一轮官方更新重复步骤 2～3</text>
  <text x="1735" y="1398" class="font small">官方更新 → 基线 → 集成 → Feature</text>

  <path d="M1960 1120 L1960 1170" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1710 1305 C1665 1305 1660 1305 1660 1305" stroke="#44546a" stroke-width="3"/>
  <path d="M1170 1305 L1120 1305" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M630 1305 L580 1305" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Rules footer -->
  <rect x="90" y="1480" width="2010" height="78" rx="12" fill="#eef4fb" stroke="#b7c9dc"/>
  <text x="120" y="1512" class="font box-title">协同规则：</text>
  <text x="280" y="1512" class="font note">① upstream 只读；② Feature 从企业集成分支创建；③ 一个分支只做一个功能；④ PR 目标为企业集成分支；⑤ 禁止直接修改集成分支和官方分支</text>
  <text x="120" y="1540" class="font note">⑥ 官方同步由指定维护者执行；⑦ 合并前必须通过测试、构建和安全检查；⑧ 所有代码变更通过 GitHub PR 留痕</text>

  <text x="1100" y="1628" text-anchor="middle" class="font small">建议：将 enterprise/integration 设为团队保护分支，启用至少 1 名 Review、CI 必须通过、禁止直接 Push</text>
</svg>
