events {
    worker_connections 1024;
}
pid /tmp/nginx.pid;
http {
    map_hash_bucket_size 128;
    # Exact confirmed corporate authorities plus explicit loopback development.
    # Add a reviewed authority here when deploying under another public URL.
    map $http_host $deerflow_host_allowed {
        default 0;
        cnoocclaw.cnooc.com.cn 1;
        cnoocclaw.cnooc.com.cn:443 1;
        cnoocclaw.cnooc.com.cn:80 1;
        heai.cnooc.com.cn 1;
        heai.cnooc.com.cn:443 1;
        heai.cnooc.com.cn:80 1;
        "~*^localhost(?::[0-9]{1,5})?$" 1;
        "~^127\.0\.0\.1(?::[0-9]{1,5})?$" 1;
        "~^\[::1\](?::[0-9]{1,5})?$" 1;
    }
    # Absolute-form request targets can override $host independently of Host.
    map $host $deerflow_hostname_allowed {
        default 0;
        cnoocclaw.cnooc.com.cn 1;
        heai.cnooc.com.cn 1;
        localhost 1;
        127.0.0.1 1;
        "[::1]" 1;
    }
    # Avoid constructing Nginx redirects from caller-controlled authority.
    absolute_redirect off;
    # Preserve authenticated REST mutations; reject unused extension methods.
    map $request_method $deerflow_method_allowed {
        default 0;
        ~^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ 1;
    }
    # Basic settings
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Bound unauthenticated Data Lake callbacks before they reach shared SQL.
    limit_req_zone $binary_remote_addr zone=data_lake_callback:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=work_oauth:1m rate=1r/s;

    # Docker internal DNS (for resolving k3s hostname)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Preserve an upstream proxy's X-Forwarded-Proto so the Gateway sees the real
    # client scheme when DeerFlow's nginx runs BEHIND another TLS-terminating
    # reverse proxy (e.g. Pangolin/Traefik, Cloudflare, Caddy). Without this the
    # Gateway treats HTTPS browser traffic as HTTP and rejects the login POST with
    # 403 "Cross-site auth request denied" (Origin scheme mismatch), and also drops
    # the Secure flag / max-age on session cookies. Falls back to $scheme when nginx
    # is itself the TLS edge (standalone `make dev` / Docker), so default
    # deployments are unchanged.
    map $http_x_forwarded_proto $forwarded_proto {
        default    $scheme;
        "~*^https" https;
    }

    # Native SkillHub validates bearer tokens itself. Browser API traffic also
    # requires the current DeerFlow session; a bearer-shaped string grants no
    # backend access unless SkillHub validates the token and its scopes.
    map $http_authorization $skillhub_bearer_request {
        default 0;
        "~*^Bearer[ ]+.+$" 1;
    }

    # ── Main server (path-based routing) ─────────────────────────────────
    server {
        listen 2026 default_server;
        listen [::]:2026 default_server;
        server_name _;
        if ($deerflow_host_allowed = 0) { return 400; }
        if ($deerflow_hostname_allowed = 0) { return 400; }
        if ($deerflow_method_allowed = 0) { return 405; }

        # Resolve Docker service names at request time to avoid stale upstream
        # IPs when containers restart and receive new addresses.
        set $gateway_upstream gateway:8001;
        set $frontend_upstream frontend:3000;
        set $skillhub_upstream skillhub-web:80;

        # Default proxy settings for all locations (streaming/SSE support)
        proxy_buffering off;
        proxy_cache off;

        # Keep the unified nginx endpoint same-origin by default. When split
        # frontend/backend or port-forwarded deployments need browser CORS,
        # configure the Gateway allowlist with GATEWAY_CORS_ORIGINS so CORS and
        # CSRF origin checks stay aligned instead of approving every origin at
        # the proxy layer.

        # Optional native SkillHub workbench. Keeping the upstream in a
        # variable lets DeerFlow start before the separately managed SkillHub
        # stack is attached to this Docker network.
        location = /platform/skillhub {
            return 308 /platform/skillhub/;
        }

        # Browser-supplied identity headers are never trusted. This internal
        # subrequest validates the existing DeerFlow HttpOnly session and
        # receives a 30-second role-free assertion from Gateway.
        # Validate the actual DeerFlow session, never caller-supplied identity.
        location = /_internal/skillhub/browser-auth {
            internal;
            proxy_pass http://gateway:8001/api/v1/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Owner-User-Id "";
            # Keep auth subrequests and native API forwarding on the same
            # authority/version boundary as the other proxy locations.
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Port "";
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /_internal/skillhub/api-auth {
            internal;
            if ($skillhub_bearer_request) { return 204; }
            proxy_pass http://gateway:8001/api/v1/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Owner-User-Id "";
            # Keep auth subrequests and native API forwarding on the same
            # authority/version boundary as the other proxy locations.
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Port "";
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location @skillhub_login {
            return 302 /login;
        }

        location = /_internal/skillhub/session-assertion {
            internal;
            proxy_pass http://$gateway_upstream/internal/skillhub/session/assertion;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # SkillHub's native passive-session endpoint remains the session/RBAC
        # owner. Nginx injects only Gateway's verified identity assertion and
        # overwrites any same-named headers supplied by the browser.
        location = /platform/skillhub/api/v1/auth/session/bootstrap {
            auth_request /_internal/skillhub/session-assertion;
            auth_request_set $skillhub_identity $upstream_http_x_skillhub_identity;
            auth_request_set $skillhub_signature $upstream_http_x_skillhub_signature;
            proxy_pass http://$skillhub_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Bootstrap is authenticated by Gateway's short-lived assertion.
            # Never let a stale native SkillHub SESSION cookie override it.
            proxy_set_header Cookie "";
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /platform/skillhub;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-SkillHub-Identity $skillhub_identity;
            proxy_set_header X-SkillHub-Signature $skillhub_signature;
            proxy_pass_header Set-Cookie;
        }

        # SkillHub's notification stream is long-lived SSE. Keep it outside
        # the buffered asset/page proxy below so native subscription and
        # governance notifications reach the embedded workbench immediately.
        location = /platform/skillhub/api/web/notifications/sse {
            auth_request /_internal/skillhub/api-auth;
            proxy_pass http://$skillhub_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /platform/skillhub;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-SkillHub-Identity "";
            proxy_set_header X-SkillHub-Signature "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 660s;
            proxy_set_header X-Accel-Buffering no;
            proxy_pass_header Set-Cookie;
        }

        location ^~ /platform/skillhub/api/ {
            auth_request /_internal/skillhub/api-auth;
            proxy_pass http://$skillhub_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            # Keep auth subrequests and native API forwarding on the same
            # authority/version boundary as the other proxy locations.
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Port "";
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /platform/skillhub;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-SkillHub-Identity "";
            proxy_set_header X-SkillHub-Signature "";
            proxy_pass_header Set-Cookie;
            # The reviewed upstream web image intentionally denies all
            # framing. Replace that restriction only on this same-origin
            # module; no other DeerFlow or WeKnora response is relaxed.
            proxy_set_header Accept-Encoding "";
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
            sub_filter_once off;
            sub_filter "frame-ancestors 'none'" "frame-ancestors 'self'";
        }

        location ^~ /platform/skillhub/ {
            auth_request /_internal/skillhub/browser-auth;
            error_page 401 = @skillhub_login;
            proxy_pass http://$skillhub_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /platform/skillhub;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-SkillHub-Identity "";
            proxy_set_header X-SkillHub-Signature "";
            proxy_pass_header Set-Cookie;
            # The reviewed upstream web image intentionally denies all
            # framing. Replace that restriction only on this same-origin
            # module; no other DeerFlow or WeKnora response is relaxed.
            proxy_set_header Accept-Encoding "";
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
            sub_filter_once off;
            sub_filter "frame-ancestors 'none'" "frame-ancestors 'self'";
        }

        # Same-origin browser microphone stream. Authentication remains owned
        # by Gateway; Nginx only preserves the WebSocket upgrade end to end.
        location = /api/voice-input/stream {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 660s;
            proxy_read_timeout 660s;
        }

        # LangGraph-compatible API routes served by Gateway.
        # Rewrites /api/langgraph/* to /api/* before proxying to Gateway.
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*) /api/$1 break;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;

            # Headers
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection '';

            # SSE/Streaming support
            proxy_set_header X-Accel-Buffering no;

            # Long chat/text-prompt support (issue #3952): a sufficiently long
            # pasted prompt otherwise exceeds nginx's default 1m
            # client_max_body_size, or gets spooled to a temp file via
            # proxy_request_buffering before reaching Gateway -- on a non-root
            # local run that temp directory may not be writable, producing a
            # raw nginx 500 instead of a graceful application error. Mirrors
            # the uploads location's fix below (same mechanism, sized for text
            # prompts rather than binary file uploads).
            client_max_body_size 20M;
            proxy_request_buffering off;

            # Timeouts for long-running requests
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Chunked transfer encoding
            chunked_transfer_encoding on;
        }

        # IAM BIM synchronization is a credentialed machine-to-machine
        # protocol. Route both the base SchemaService URL and child services
        # directly to Gateway before the general /api/ fallback.
        location = /api/v1/iam/account-sync {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ^~ /api/v1/iam/account-sync/ {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Authenticated Data Lake browser endpoints belong to DeerFlow
        # Gateway. The exact public callback route remains separately
        # rate-limited below and takes precedence over this prefix.
        location ^~ /api/v1/data-lake/auth/ {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Frontend API: runtime configuration is served by Next.js, not Gateway.
        location /api/runtime-config {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Frontend API: external-agent launch handlers read the HttpOnly
        # platform-token cookie and issue allowlisted data-lake redirects.
        location ^~ /api/cnooc/external-agents/ {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Frontend API: shop-cart list and download handlers exchange the
        # HttpOnly platform-token cookie for data-lake API requests.
        location ^~ /api/shop-cart/ {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Custom API: Models endpoint
        location /api/models {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # Custom API: Memory endpoint
        location /api/memory {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # Custom API: MCP configuration endpoint
        location /api/mcp {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # Custom API: Skills configuration endpoint
        location /api/skills {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Skill install/edit/rollback may run one LLM security scan per file.
            proxy_read_timeout 600s;
        }

        # Custom API: Agents endpoint
        location /api/agents {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # Custom API: Uploads endpoint
        location ~ ^/api/threads/[^/]+/uploads {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Large file upload support
            client_max_body_size 100M;
            proxy_request_buffering off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Disable response buffering to avoid permission errors
        }

        # Live digital-employee browser stream. This WebSocket route must be
        # matched before the generic thread API proxy below.
        location ~ ^/api/threads/[^/]+/browser/stream {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Custom API: Other endpoints under /api/threads
        location ~ ^/api/threads {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Compaction, suggestions, and run waits may exceed nginx's 60s default.
            proxy_read_timeout 600s;
        }

        # API Documentation: Swagger UI
        location /docs {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # API Documentation: ReDoc
        location /redoc {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # API Documentation: OpenAPI Schema
        location /openapi.json {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # Health check endpoint (gateway)
        location /health {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # ── Provisioner API (sandbox management) ────────────────────────
        # Use a variable so nginx resolves provisioner at request time (not startup).
        # This allows nginx to start even when provisioner container is not running.
        location /api/sandboxes {
            set $provisioner_upstream provisioner:8002;
            proxy_pass http://$provisioner_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

        }

        # Public Data Lake callback. Keep this exact route ahead of the API
        # catch-all so malformed or replayed requests cannot flood shared SQL.
        # Work OAuth query values are credentials; never log them.
        location = /api/integrations/work/oauth/authorize {
            limit_req zone=work_oauth burst=10 nodelay;
            limit_req_status 429;
            access_log off;
            error_log /dev/null;
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 60s;
        }

        # Work OAuth query values are credentials; never log them.
        location = /api/integrations/work/oauth/callback {
            limit_req zone=work_oauth burst=10 nodelay;
            limit_req_status 429;
            access_log off;
            error_log /dev/null;
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 60s;
        }

        location = /api/v1/data-lake/auth/callback {
            limit_req zone=data_lake_callback burst=10 nodelay;
            limit_req_status 429;
            error_page 429 = @data_lake_callback_rate_limited;

            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location @data_lake_callback_rate_limited {
            internal;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Request-Id $request_id always;
            return 429 '{"code":"callback_rate_limited","message":"Too many callback requests."}';
        }

        # Catch-all for /api/ routes not covered above (e.g. /api/v1/auth/*).
        # More specific prefix and regex locations above still take precedence.
        location /api/ {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Disable buffering to avoid permission errors when nginx
            # runs as a non-root user (e.g. local development).
            # Run waits and input-polish model calls may exceed 60 seconds.
            proxy_read_timeout 600s;
        }

        location ^~ /_next/static/ {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # All other requests go to frontend
        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;

            # Headers
            # Suppress upstream framework/version headers in every proxy location.
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header X-AspNetMvc-Version;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, must-revalidate" always;

            # Timeouts
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
