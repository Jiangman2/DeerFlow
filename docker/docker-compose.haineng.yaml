# Optional Haineng network overlay. No shared personal SESSION is accepted.
services:
  frontend:
    extra_hosts:
      - "heq.cnooc.com.cn:${HAINENG_HOST_IP:-10.74.5.6}"
    environment:
      HAINENG_APP_ORIGIN: ${HAINENG_APP_ORIGIN:?Set the public origin including https://}
      # Reuse stable BETTER_AUTH_SECRET from the main compose environment.
      # Or set a dedicated application signing key, never a Haineng SESSION.
      HAINENG_CONVERSATION_SECRET: ${HAINENG_CONVERSATION_SECRET:-${BETTER_AUTH_SECRET}}
