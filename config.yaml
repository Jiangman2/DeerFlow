# Configuration for the DeerFlow application
#
# Guidelines:
# - Copy this file to `config.yaml` and customize it for your environment
# - The default path of this configuration file is `config.yaml` in the current working directory.
#   However you can change it using the `DEER_FLOW_CONFIG_PATH` environment variable.
# - Environment variables are available for all field values. Example: `api_key: $OPENAI_API_KEY`
# - The `use` path is a string that looks like "package_name.sub_package_name.module_name:class_name/variable_name".

# ============================================================================
# Config Version (used to detect outdated config files)
# ============================================================================
# Bump this number when the config schema changes.
# Run `make config-upgrade` to merge new fields into your local config.yaml.
config_version: 3

# ============================================================================
# Models Configuration
# ============================================================================
# Configure available LLM models for the agent to use

models:
  - name: qwen3.6-plus
    display_name: Qwen3.6-Plus (百炼)
    use: langchain_openai:ChatOpenAI
    model: qwen3.6-plus
    api_key: $DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    max_tokens: 8192
    timeout: 60
    supports_thinking: false
    supports_vision: false
  - name: deepseek-v4-pro-bailian
    display_name: DeepSeek V4 Pro (百炼兼容)
    use: langchain_openai:ChatOpenAI
    model: deepseek-v4-pro
    api_key: $DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    max_tokens: 8192
    timeout: 60
    supports_thinking: true
    supports_vision: false
    when_thinking_enabled:
      extra_body:
        enable_thinking: true
  - name: deepseek-siliconflow
    display_name: DeepSeek SiliconFlow (内网)
    use: langchain_openai:ChatOpenAI
    model: deepseek-siliconflow
    api_key: $SILICONFLOW_API_TOKEN
    base_url: http://model.ai.cnooc/member1/deepseek-siliconflow/v1
    max_tokens: 8192
    timeout: 60
    supports_thinking: true
    supports_vision: true
  - name: hecc-deepseek-v3-2
    display_name: 海能 DeepSeek V3.2 (内网)
    use: deerflow.models.hecc_openai:HeccChatOpenAI
    model: deepseek-v3.2
    api_key: $HECC_API_KEY
    base_url: https://hecc.ai.cnooc:30119/heai/Deepseek_V3.2_671B_64K/v1/
    tls_verify: false
    max_tokens: 8192
    timeout: 60
    supports_thinking: true
    supports_vision: false
    when_thinking_enabled:
      extra_body:
        enable_thinking: true
        thinking_budget: 512
  - name: qwen3-235b
    display_name: Qwen3-235B (内网)
    use: langchain_openai:ChatOpenAI
    model: Qwen3-235B
    api_key: local
    base_url: http://model.ai.cnooc/member1/qwen3-235b-instruct/v1
    max_tokens: 8192
    temperature: 0.0
    top_p: 0.0
    timeout: 60
    supports_thinking: false
    supports_vision: false

