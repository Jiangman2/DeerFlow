<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞书授权回调</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 40px;
            max-width: 560px;
            width: 100%;
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #666; margin-bottom: 24px; }
        .code-box {
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            word-break: break-all;
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            font-size: 14px;
            color: #333;
            line-height: 1.6;
            user-select: all;
        }
        .state-info {
            font-size: 12px;
            color: #999;
            margin-bottom: 20px;
            word-break: break-all;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-copy-all {
            background: #e9ecef;
            color: #495057;
            margin-left: 8px;
        }
        .btn-copy-all:hover { background: #dee2e6; }
        .tip {
            margin-top: 24px;
            padding: 12px 16px;
            background: #fff3cd;
            border-radius: 8px;
            font-size: 13px;
            color: #856404;
            text-align: left;
            line-height: 1.6;
        }
        .error-box {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            color: #721c24;
            font-size: 14px;
        }
        .success-msg {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            color: #155724;
            font-size: 13px;
            display: none;
        }
        .url-box {
            background: #f0f4ff;
            border: 1px solid #d0daff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            word-break: break-all;
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            font-size: 12px;
            color: #495057;
            user-select: all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <div class="icon">⏳</div>
            <h1>正在解析授权结果...</h1>
        </div>

        <div id="success" style="display:none;">
            <div class="icon">✅</div>
            <h1>授权成功</h1>
            <p class="subtitle">请复制下方的授权码（code），发回给 AI 助手完成登录</p>
            <div class="code-box" id="codeDisplay"></div>
            <div class="state-info" id="stateDisplay"></div>
            <div>
                <button class="btn btn-primary" onclick="copyCode()">复制 Code</button>
                <button class="btn btn-copy-all" onclick="copyFullUrl()">复制完整 URL</button>
            </div>
            <div class="success-msg" id="copyMsg">已复制到剪贴板 ✓</div>
            <div class="tip">
                <strong>操作提示：</strong><br>
                1. 点击上方「复制 Code」按钮<br>
                2. 回到 AI 对话窗口<br>
                3. 将 code 粘贴发送即可<br><br>
                <em>也可以直接复制浏览器地址栏的完整 URL 发回，AI 会自动解析。</em>
            </div>
        </div>

        <div id="error" style="display:none;">
            <div class="icon">❌</div>
            <h1>授权失败</h1>
            <div class="error-box" id="errorDetail"></div>
            <p class="subtitle">请关闭本页面，回到对话窗口告知 AI 助手错误信息，或重新尝试授权。</p>
            <div class="url-box" id="errorUrl"></div>
            <button class="btn btn-primary" onclick="copyFullUrl()">复制完整 URL</button>
        </div>

        <div id="nocode" style="display:none;">
            <div class="icon">🔗</div>
            <h1>飞书授权回调页</h1>
            <p class="subtitle">本页面用于接收飞书 OAuth 授权回调。<br>请通过 AI 助手提供的授权链接进行授权，授权完成后会自动跳转到本页。</p>
        </div>
    </div>

    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            var state = params.get('state');
            var error = params.get('error');
            var errorDesc = params.get('error_description');

            document.getElementById('loading').style.display = 'none';

            if (error) {
                document.getElementById('error').style.display = 'block';
                document.getElementById('errorDetail').textContent =
                    '错误类型: ' + error + (errorDesc ? '\n错误描述: ' + errorDesc : '');
                document.getElementById('errorUrl').textContent = window.location.href;
                return;
            }

            if (code) {
                document.getElementById('success').style.display = 'block';
                document.getElementById('codeDisplay').textContent = code;
                if (state) {
                    document.getElementById('stateDisplay').textContent = 'state: ' + state;
                }
                return;
            }

            // 无 code 无 error，显示说明页
            document.getElementById('nocode').style.display = 'block';
        })();

        function copyCode() {
            var code = new URLSearchParams(window.location.search).get('code');
            if (!code) return;
            copyToClipboard(code);
        }

        function copyFullUrl() {
            copyToClipboard(window.location.href);
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(showCopyMsg).catch(function() {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); showCopyMsg(); } catch(e) {}
            document.body.removeChild(ta);
        }

        function showCopyMsg() {
            var msg = document.getElementById('copyMsg');
            if (msg) {
                msg.style.display = 'block';
                setTimeout(function() { msg.style.display = 'none'; }, 2000);
            }
        }
    </script>
</body>
</html>
