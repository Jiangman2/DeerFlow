name: November 2 released fixes
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'release/nov02-released-fixes-source-20261103/**'
      - 'release/pr26-ci-qualification-20261103/**'
      - 'release/enterprise-source-followup-20261103/**'
      - 'release/artifact-directory-20261104/**'
      - 'release/dashboard-navigation-20261103/**'
      - 'release/dashboard-navigation-20261103-r2/**'
      - 'deploy/enterprise/*dashboard*navigation*'
      - 'deploy/enterprise/*enterprise_source_followup*'
      - 'deploy/enterprise/*new_chat_model_source*'
      - 'release/new-chat-model-source-20261105/**'
      - 'deploy/enterprise/*nov02*'
      - 'deploy/enterprise/released_source_20261102.py'
      - 'deploy/enterprise/released-source-delta-20261102.json'
      - 'deploy/enterprise/verify-release-source-20261023.py'
      - 'deploy/enterprise/verify-production-baseline-20261029.py'
      - '.github/workflows/nov02-released-fixes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -B deploy/enterprise/test_new_chat_model_source_20261105.py
      - run: python deploy/enterprise/test_nov02_source_delta.py
      - run: python deploy/enterprise/test_dashboard_navigation_source_20261103.py
      - run: python deploy/enterprise/test_dashboard_navigation_frontend_package_20261103.py
      - run: python deploy/enterprise/test_dashboard_navigation_frontend_activation_20261104.py
      - run: python deploy/enterprise/verify-dashboard-navigation-source-20261103.py --ref HEAD
      - run: python deploy/enterprise/test_enterprise_source_followup_20261103.py
      - run: python deploy/enterprise/test_nov01_source_delta.py
      - run: python deploy/enterprise/verify-nov02-released-source-20261103.py --ref HEAD
      - run: python deploy/enterprise/verify-nov01-released-source-20261102.py --ref HEAD
      - run: python deploy/enterprise/verify-production-baseline-20261029.py --ref HEAD
