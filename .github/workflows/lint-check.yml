name: Lint Check

on:
  push:
    branches: [ 'main', '2.0.x-dev' ]
  pull_request:
    branches: [ '*', 'codex/enterprise-consolidation-20260716' ]

permissions:
  contents: read

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check uv.lock is in sync
        working-directory: backend
        run: uv lock --check

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --group dev

      - name: Lint backend
        working-directory: backend
        run: make lint

      - name: Verify production source provenance
        run: python deploy/enterprise/verify-release-source-20261023.py

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Install frontend dependencies
        id: frontend-deps
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Check frontend formatting
        if: ${{ !cancelled() && steps.frontend-deps.outcome == 'success' }}
        run: |
          cd frontend
          pnpm format

      - name: Run frontend linting
        if: ${{ !cancelled() && steps.frontend-deps.outcome == 'success' }}
        run: |
          cd frontend
          pnpm lint

      - name: Check TypeScript types
        if: ${{ !cancelled() && steps.frontend-deps.outcome == 'success' }}
        run: |
          cd frontend
          pnpm typecheck

      - name: Build frontend
        if: ${{ !cancelled() && steps.frontend-deps.outcome == 'success' }}
        run: |
          cd frontend
          BETTER_AUTH_SECRET=local-dev-secret pnpm build
