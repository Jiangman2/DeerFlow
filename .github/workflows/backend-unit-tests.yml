name: Unit Tests

on:
  push:
    branches: [ 'main', '2.0.x-dev' ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --group dev --extra postgres

      - name: Run unit tests of backend
        working-directory: backend
        run: make test

  incident-postgres-regressions:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incident_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-incident-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d incident_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CHANNEL_RECOVERY_TEST_POSTGRES: postgresql+asyncpg://postgres:local-incident-test@127.0.0.1:5432/incident_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --group dev --extra postgres
      - name: Verify concurrent recovery and month-sized SQL queries
        working-directory: backend
        run: uv run pytest tests/test_channel_thread_recovery_postgres.py tests/test_dashboard_large_window_postgres.py -q
